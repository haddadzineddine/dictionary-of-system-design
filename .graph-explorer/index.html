<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictionary of System Design — Graph</title>
    <style>
      :root {
        --bg: #edede9;
        --panel: #f5f5f1;
        --ink: #1c1c1a;
        --muted: #6d6d68;
        --line: #d4d4cf;
        --mono:
          ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 var(--sans);
        overflow: hidden;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      #app {
        display: flex;
        height: 100dvh;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      #graph {
        position: absolute;
        inset: 0;
      }

      .round {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
      }
      .round:hover {
        border-color: var(--ink);
      }
      .round svg {
        width: 16px;
        height: 16px;
      }

      #top-left {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #brand {
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #info-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 3;
        font-family: var(--mono);
        font-size: 13px;
      }
      #hint {
        position: absolute;
        bottom: 16px;
        left: 18px;
        z-index: 2;
        margin: 0;
        font: 12px var(--mono);
        color: var(--muted);
        pointer-events: none;
      }

      .popover {
        position: absolute;
        top: 66px;
        z-index: 4;
        width: min(360px, calc(100% - 36px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.1);
      }
      #search {
        left: 18px;
        overflow: hidden;
      }
      #search input {
        width: 100%;
        padding: 12px 14px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        font: 15px var(--sans);
        color: var(--ink);
        outline: none;
      }
      #results {
        max-height: min(55vh, 420px);
        margin: 0;
        padding: 4px;
        overflow-y: auto;
        list-style: none;
      }
      #results li {
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
      }
      #results li[aria-selected="true"] {
        background: var(--ink);
        color: var(--panel);
      }
      #results small {
        display: block;
        overflow: hidden;
        font-size: 12px;
        opacity: 0.7;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results .none {
        color: var(--muted);
        cursor: default;
      }
      #info {
        right: 18px;
        padding: 16px 18px;
        font-size: 14px;
      }
      #info h2 {
        margin: 0 0 6px;
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #info p {
        margin: 0 0 8px;
      }
      #info p:last-child {
        margin-bottom: 0;
      }
      kbd {
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: 12px var(--mono);
      }

      #panel {
        position: relative;
        flex: 0 0 var(--panel-width, min(560px, 42vw));
        height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      #resizer {
        position: relative;
        z-index: 5;
        flex: 0 0 11px;
        margin: 0 -6px 0 -5px;
        cursor: col-resize;
        touch-action: none;
      }
      #resizer::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 4px;
        width: 3px;
        background: transparent;
        transition: background 0.12s;
      }
      #resizer:hover::after,
      #resizer:focus-visible::after,
      .resizing #resizer::after {
        background: var(--ink);
      }
      #resizer:focus-visible {
        outline: none;
      }
      .resizing {
        cursor: col-resize;
        user-select: none;
      }
      #close {
        position: sticky;
        top: 16px;
        z-index: 2;
        float: right;
        margin: 16px 16px 0 0;
        font-size: 18px;
        line-height: 1;
      }
      #panel-body {
        padding: 30px 30px 44px;
      }
      .eyebrow,
      .label {
        font: 11px var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #panel h1 {
        margin: 6px 48px 12px 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        outline: none;
      }
      .lede {
        margin: 0;
        font-size: 16px;
      }
      .block {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .label {
        display: block;
        margin-bottom: 12px;
      }
      .bubbles {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 88%;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 10px;
      }
      .bubble:nth-child(odd) {
        align-self: flex-start;
        background: #fbfbf8;
        border: 1px solid var(--line);
      }
      .bubble:nth-child(even) {
        align-self: flex-end;
        background: var(--ink);
        color: #f5f5f1;
      }
      .bubble code {
        background: rgb(127 127 127 / 0.22);
      }
      .avoid {
        margin: 0;
        font-size: 14px;
        color: #3b3b38;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        padding: 3px 11px;
        font-size: 13px;
        text-decoration: none;
        background: transparent;
        border: 1px solid #a9a9a3;
        border-radius: 999px;
      }
      .chip:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--panel);
      }
      details summary {
        cursor: pointer;
        list-style-position: inside;
      }
      details .label {
        display: inline;
        margin: 0;
      }
      .entry {
        margin-top: 12px;
        font-size: 14px;
      }
      .entry p,
      .entry ul,
      .entry ol,
      .entry blockquote,
      .entry pre,
      .entry .table {
        margin: 0 0 12px;
      }
      .entry ul,
      .entry ol {
        padding-left: 20px;
      }
      .entry h4 {
        margin: 16px 0 6px;
        font-size: 14px;
      }
      .entry blockquote {
        padding-left: 12px;
        border-left: 2px solid var(--line);
      }
      .entry .table {
        overflow-x: auto;
      }
      .entry table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .entry th,
      .entry td {
        padding: 6px 8px 6px 0;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      .entry pre {
        padding: 10px;
        overflow-x: auto;
        background: #e7e7e2;
        border-radius: 6px;
      }
      code {
        padding: 1px 4px;
        font: 0.9em var(--mono);
        background: #e7e7e2;
        border-radius: 4px;
      }
      pre code {
        padding: 0;
        background: none;
      }

      @media (max-width: 720px) {
        #app {
          flex-direction: column;
        }
        #panel {
          flex: 0 0 58dvh;
          width: 100%;
          height: 58dvh;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
        #panel-body {
          padding: 22px 20px 36px;
        }
        #hint,
        #resizer,
        .has-selection #brand {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div
          id="graph"
          role="img"
          aria-label="Force-directed graph of entries and the links between them. Use search to reach one by keyboard."
        ></div>
        <div id="top-left">
          <button
            id="search-btn"
            class="round"
            aria-label="Search entries"
            title="Search (/)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.8-3.8" />
            </svg>
          </button>
          <span id="brand">Dictionary of System Design</span>
        </div>
        <button
          id="info-btn"
          class="round"
          aria-label="About this graph"
          aria-expanded="false"
          title="About"
        >
          i
        </button>
        <div id="search" class="popover" hidden>
          <input
            id="search-input"
            type="search"
            placeholder="Search entries"
            aria-label="Search entries"
            role="combobox"
            aria-expanded="true"
            aria-controls="results"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="results" role="listbox" aria-label="Matching entries"></ul>
        </div>
        <div id="info" class="popover" hidden>
          <h2>Reading the graph</h2>
          <p id="info-counts"></p>
          <p>
            Larger, darker circles are linked to by more entries. Dots on a line
            move in the direction of the link.
          </p>
          <p>
            Click a circle to read it. Drag to rearrange, scroll to zoom.
            <kbd>/</kbd> searches, <kbd>Esc</kbd> closes.
          </p>
        </div>
        <p id="hint">Click a circle, or press / to search</p>
      </main>
      <div
        id="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize details panel"
        aria-controls="panel"
        tabindex="0"
        title="Drag to resize, double-click to reset"
        hidden
      ></div>
      <aside id="panel" aria-label="Term details" hidden>
        <button id="close" class="round" aria-label="Close details">×</button>
        <div id="panel-body"></div>
      </aside>
    </div>

    <script id="graph-data" type="application/json">
      {"title":"Dictionary of System Design","noun":"entry","nouns":"entries","labels":{"quotes":"Heard in the wild","note":"Note","outgoing":"Connects to","incoming":"Linked from","body":"Full entry"},"sections":["Thinking in Systems","Scaling","Traffic","Caching","Asynchronous Work","Resilience","Architecture Styles"],"terms":[{"name":"Functional requirement","section":0,"description":"A statement of what a system must do, such as letting a user upload a photo or cancel an order.","body":"\u003cp>A functional requirement is a statement of what a system must do: a user can upload a photo, a customer can cancel an order, an admin can export last month's invoices. It describes behaviour you can check with a yes or a no.\u003c/p>\u003cp>Functional requirements come first in a design because they determine the data and the operations. &quot;Users post short messages and see posts from people they follow&quot; already implies a store of users, a follow relationship, a store of posts and a timeline read. How that timeline gets built, for example with \u003ca href=\"#Fan-out%20on%20write\" data-term=\"Fan-out on write\">fan-out on write\u003c/a>, depends on what the feature has to show.\u003c/p>\u003cp>They are paired with \u003ca href=\"#Non-functional%20requirement\" data-term=\"Non-functional requirement\">non-functional requirements\u003c/a>, which say how well the system must do those things. &quot;Users can search products&quot; is functional. &quot;Search returns within 200 ms&quot; is non-functional.\u003c/p>\u003cp>A short set of questions usually produces the list:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Example answer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Who uses it?\u003c/td>\u003ctd>Shoppers, warehouse staff, support agents\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What can they do?\u003c/td>\u003ctd>Place an order, track it, request a refund\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What data goes in and out?\u003c/td>\u003ctd>Order lines in, order status out\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What is out of scope?\u003c/td>\u003ctd>Gift cards, third-party sellers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The out-of-scope row prevents a common failure. A team builds for weeks, then learns in review that &quot;notifications&quot; meant SMS as well as email, or that refunds had to support part of an order. Writing the list down and getting it confirmed exposes that disagreement while it is still inexpensive to fix.\u003c/p>\u003cp>Keep the list short during a design discussion. Pick the few operations that drive the architecture, and leave settings pages and profile edits aside unless they change the shape of the system.\u003c/p>","avoid":"","usage":["Should the feed include reposts, or only original posts?","Nobody wrote that down. Let's settle the functional requirements before we argue about storage, because reposts change what each timeline has to hold."],"out":[16,1]},{"name":"Non-functional requirement","section":0,"description":"A measurable statement of how well a system must work, covering qualities like speed, availability, durability and cost.","body":"\u003cp>Where a \u003ca href=\"#Functional%20requirement\" data-term=\"Functional requirement\">functional requirement\u003c/a> says what a system must do, a non-functional requirement says how well it must do it. For &quot;users can search products&quot;, the non-functional version is &quot;95% of searches return within 200 ms at 5,000 searches per second&quot;.\u003c/p>\u003cp>These requirements shape the architecture more than the feature list does. A photo-sharing app for 50 people and one for 50 million have similar features and very different designs. A system that works in a demo and times out on launch day usually met its functional requirements and had no stated target for load.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quality\u003c/th>\u003cth>Example target\u003c/th>\u003cth>Design consequence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Latency\" data-term=\"Latency\">Latency\u003c/a>\u003c/td>\u003ctd>99% of page loads under 500 ms\u003c/td>\u003ctd>\u003ca href=\"#Cache\" data-term=\"Cache\">Caches\u003c/a>, fewer network hops\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Throughput\" data-term=\"Throughput\">Throughput\u003c/a>\u003c/td>\u003ctd>5,000 orders per second at peak\u003c/td>\u003ctd>\u003ca href=\"#Horizontal%20scaling\" data-term=\"Horizontal scaling\">Horizontal scaling\u003c/a>, queues\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Availability\u003c/td>\u003ctd>99.9% of requests succeed monthly\u003c/td>\u003ctd>Redundancy, no \u003ca href=\"#Single%20point%20of%20failure\" data-term=\"Single point of failure\">single point of failure\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Durability\u003c/td>\u003ctd>A confirmed payment is never lost\u003c/td>\u003ctd>Replicated storage, backups\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consistency\u003c/td>\u003ctd>Balance is correct after a transfer\u003c/td>\u003ctd>Limits on caching and asynchronous updates\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cost\u003c/td>\u003ctd>Under a set monthly budget\u003c/td>\u003ctd>Smaller fleet, simpler components\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Targets need numbers to be useful. &quot;The system must be fast&quot; cannot be tested and cannot settle an argument. A number also shows what a goal costs. An availability target of 99.9% allows about 43 minutes of downtime in a 30-day month, while 99.99% allows about 4 minutes, which is too short for a person to respond to most failures and generally requires automated failover.\u003c/p>\u003cp>The qualities also compete. Stronger consistency tends to raise latency, and higher availability raises cost. Ask which requirement wins when two conflict, because that answer decides many later design choices. A payment system and a social feed will answer differently.\u003c/p>","avoid":"","usage":["Do we really need multi-region for the internal reporting tool?","Check the non-functional requirements. It needs 99.5% during office hours, so one region with a tested restore is enough."],"out":[0,3,29,4,11,7]},{"name":"Back-of-the-envelope estimation","section":0,"description":"A quick calculation with rounded numbers that sizes traffic, storage and bandwidth before any design decision is made.","body":"\u003cp>Back-of-the-envelope estimation is a quick calculation with rounded numbers that tells you the rough size of a system before you design it. The aim is the right order of magnitude. Knowing whether a service handles 10, 1,000 or 100,000 requests per second decides whether one server is enough or a distributed design is needed.\u003c/p>\u003cp>A useful shortcut is that a day has 86,400 seconds, which rounds to 100,000. Here is a worked estimate for a social app with 10 million daily users:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Quantity\u003c/th>\u003cth>Calculation\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Reads per day\u003c/td>\u003ctd>10M users × 20 reads\u003c/td>\u003ctd>200M\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Average reads\u003c/td>\u003ctd>200M ÷ 86,400 s\u003c/td>\u003ctd>About 2,300/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Peak reads\u003c/td>\u003ctd>2,300/s × 3 (assumed peak factor)\u003c/td>\u003ctd>About 7,000/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Writes per day\u003c/td>\u003ctd>10M users × 0.1 posts\u003c/td>\u003ctd>1M, about 12/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Storage per year\u003c/td>\u003ctd>1M posts × 2 KB × 365\u003c/td>\u003ctd>About 730 GB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Peak \u003ca href=\"#Bandwidth\" data-term=\"Bandwidth\">bandwidth\u003c/a>\u003c/td>\u003ctd>7,000/s × 50 KB\u003c/td>\u003ctd>350 MB/s, 2.8 Gbps\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The result already suggests a design. Reads outnumber writes 200 to 1, so this is a \u003ca href=\"#Read-heavy%20workload\" data-term=\"Read-heavy workload\">read-heavy workload\u003c/a> and a \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> will help. Storage fits on one machine for years, so splitting the database across machines is not yet justified.\u003c/p>\u003cp>Estimation prevents two opposite mistakes. One is building a sharded, multi-region platform for traffic a single server could handle. The other is shipping a design that hits its \u003ca href=\"#Bottleneck\" data-term=\"Bottleneck\">bottleneck\u003c/a> in the first week because nobody multiplied the expected users by the payload size.\u003c/p>\u003cp>State every assumption next to its number, because the assumptions are what reviewers can challenge. Plan for peak rather than average traffic, and remember that bits and bytes differ by a factor of eight.\u003c/p>","avoid":"","usage":["We'll need Kafka and a dozen nodes for the audit log, right?","Do the back-of-the-envelope estimation first. It's 40 writes per second at peak, and one Postgres instance can handle that."],"out":[5,8,29,6]},{"name":"Latency","section":0,"description":"The time one operation takes from start to result, usually reported as percentiles because averages hide slow requests.","body":"\u003cp>Latency is the time one operation takes, from the moment it starts to the moment its result arrives. For a web request, that includes network travel, time spent waiting in queues, processing, and the trip back. Some texts reserve &quot;latency&quot; for the waiting part and use &quot;response time&quot; for the total, but in everyday use engineers mean the total.\u003c/p>\u003cp>Latency is reported in percentiles because averages hide the slow requests. The p50 is the median. The p99 is the value that 99% of requests beat. A dashboard can show an 80 ms average while users complain about a slow checkout, because the p99 is 3 seconds. A person who loads many pages per session will run into that slow 1% regularly.\u003c/p>\u003cp>Rough magnitudes are useful for reasoning about where time goes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Operation\u003c/th>\u003cth>Rough time\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Read from main memory\u003c/td>\u003ctd>About 100 nanoseconds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Random read from an SSD\u003c/td>\u003ctd>Tens to hundreds of microseconds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network round trip in a data centre\u003c/td>\u003ctd>Under 1 millisecond\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network round trip between continents\u003c/td>\u003ctd>About 50 to 300 milliseconds\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These gaps explain many design choices. A \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> in memory avoids a slower lookup, and a \u003ca href=\"#CDN\" data-term=\"CDN\">CDN\u003c/a> moves content closer to the user because no amount of server tuning shortens the distance light travels through fibre.\u003c/p>\u003cp>Latency also depends on load. As a component approaches its capacity, requests spend more time queueing, so latency climbs sharply before \u003ca href=\"#Throughput\" data-term=\"Throughput\">throughput\u003c/a> reaches its limit. A rising p99 is often the first visible sign of a \u003ca href=\"#Bottleneck\" data-term=\"Bottleneck\">bottleneck\u003c/a>.\u003c/p>\u003cp>To reduce latency, measure each stage of a request first. Then remove network hops, run independent calls in parallel, or do the work ahead of time.\u003c/p>","avoid":"","usage":["The average is fine, so why is support getting complaints about search?","Look at the p99 latency. One request in a hundred takes four seconds, and the average hides it."],"out":[29,24,4,6]},{"name":"Throughput","section":0,"description":"The amount of work a system completes per unit of time, such as requests per second or messages per minute.","body":"\u003cp>Throughput is the amount of work a system completes per unit of time. It is measured in whatever unit fits the job: requests per second, orders per minute, messages per second, or gigabytes per hour. It counts completed work, so a server that accepts 10,000 requests per second and finishes 6,000 has a throughput of 6,000.\u003c/p>\u003cp>Throughput and \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a> are related but separate. Latency is how long one request takes. Throughput is how many finish per second. A system can have high throughput and poor latency, as a batch job does, or low latency and low throughput, as a single fast worker does.\u003c/p>\u003cp>Little's law connects them. The average number of requests in flight equals throughput multiplied by the average time each one spends in the system:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Throughput\u003c/th>\u003cth>Average latency\u003c/th>\u003cth>Requests in flight\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1,000/s\u003c/td>\u003ctd>50 ms\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1,000/s\u003c/td>\u003ctd>200 ms\u003c/td>\u003ctd>200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1,000/s\u003c/td>\u003ctd>2 s\u003c/td>\u003ctd>2,000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The table explains a common incident. A database slows from 50 ms to 2 seconds, and at the same arrival rate the number of in-flight requests grows forty-fold. Connection pools and worker threads fill up, and the service starts failing even though traffic did not change.\u003c/p>\u003cp>Every system has a maximum throughput, set by its \u003ca href=\"#Bottleneck\" data-term=\"Bottleneck\">bottleneck\u003c/a>. As load approaches that limit, requests queue and latency rises. Beyond it, throughput can fall, because the system spends effort on requests that time out before finishing. This is the reason for \u003ca href=\"#Load%20shedding\" data-term=\"Load shedding\">load shedding\u003c/a>.\u003c/p>\u003cp>To raise throughput, remove the limiting resource, add capacity with \u003ca href=\"#Horizontal%20scaling\" data-term=\"Horizontal scaling\">horizontal scaling\u003c/a>, or batch small operations so each unit of overhead covers more work. Load-test to find the real limit, because a capacity figure derived from one instance rarely holds once instances share a database.\u003c/p>","avoid":"","usage":["We doubled the workers, but we still process about 800 jobs a second.","Then workers aren't what limits throughput. Check the database, it's probably saturated."],"out":[3,6,51,11]},{"name":"Bandwidth","section":0,"description":"The maximum data rate a network link can carry, usually in bits per second. It is a capacity, not the speed you achieve.","body":"\u003cp>Bandwidth is the maximum rate at which a network link can carry data, usually stated in bits per second. A 10 Gbps network card can move at most 10 gigabits each second. It is a capacity. What you actually achieve is \u003ca href=\"#Throughput\" data-term=\"Throughput\">throughput\u003c/a>, which is lower because of protocol overhead, congestion and the speed of whatever sits at each end.\u003c/p>\u003cp>Network capacity is quoted in bits, while file sizes are quoted in bytes, and mixing them up produces estimates that are wrong by a factor of eight. A 1 Gbps link carries at most 125 megabytes per second.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Link\u003c/th>\u003cth>Maximum in bytes\u003c/th>\u003cth>Time to move 1 TB at full rate\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 Gbps\u003c/td>\u003ctd>125 MB/s\u003c/td>\u003ctd>About 2.2 hours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10 Gbps\u003c/td>\u003ctd>1.25 GB/s\u003c/td>\u003ctd>About 13 minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100 Gbps\u003c/td>\u003ctd>12.5 GB/s\u003c/td>\u003ctd>About 80 seconds\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Bandwidth and \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a> solve different problems. Bandwidth is the width of the pipe, and latency is how long a byte takes to reach the other end. A larger pipe speeds up a big download but does little for a small API call, whose duration is dominated by round trips. Upgrading a link will not fix a chatty service that makes thirty sequential calls across regions.\u003c/p>\u003cp>Bandwidth becomes the \u003ca href=\"#Bottleneck\" data-term=\"Bottleneck\">bottleneck\u003c/a> when payloads are large. A service sending 500 KB images 2,000 times per second needs 1 GB/s, or 8 Gbps, before overhead. On a 10 Gbps card that leaves little headroom, so the service can stall with low CPU and plenty of free memory. When a server looks idle and responses are still slow, check network utilisation.\u003c/p>\u003cp>Common remedies are compressing responses, resizing images, paginating large results, and serving static files from a \u003ca href=\"#CDN\" data-term=\"CDN\">CDN\u003c/a>. These also reduce data transfer charges, which cloud providers typically bill on outbound traffic.\u003c/p>","avoid":"","usage":["CPU is at 20% on the media servers, but downloads crawl at peak.","Check the NICs. We're pushing 9 Gbps through 10 Gbps cards, so we've run out of bandwidth."],"out":[4,3,6,24]},{"name":"Bottleneck","section":0,"description":"The one resource or component that limits a system's overall throughput, so that improving anything else changes nothing.","body":"\u003cp>A bottleneck is the resource or component that limits how much work a whole system can do. A request path can only move as much work as its most constrained step allows. If the web tier handles 10,000 requests per second and the database handles 2,000, the system's \u003ca href=\"#Throughput\" data-term=\"Throughput\">throughput\u003c/a> is 2,000.\u003c/p>\u003cp>The usual symptom is that adding capacity has no effect. A team doubles the application servers, and the graphs do not move, because every server is waiting on the same saturated database. In some cases things get worse, since more servers open more connections to the component that is already struggling.\u003c/p>\u003cp>To find a bottleneck, look for the place where work piles up:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What to check\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Trace a slow request and see which stage takes the time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Check utilisation of CPU, memory, disk and \u003ca href=\"#Bandwidth\" data-term=\"Bandwidth\">bandwidth\u003c/a> on each tier\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Look for growing queues, full connection pools and lock waits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Fix the limiting resource\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Load-test again, because the limit will now sit somewhere else\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Step 5 matters because removing one bottleneck exposes the next. Add a \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> in front of the database and the limit may move to the network or to a single busy partition.\u003c/p>\u003cp>A bottleneck is not always a whole machine. It can be one lock, one \u003ca href=\"#Hot%20key\" data-term=\"Hot key\">hot key\u003c/a>, a single-threaded process using one CPU while the others sit idle, or an external API with a quota. Average utilisation can hide all of these, so inspect individual instances and resources.\u003c/p>\u003cp>Fixes depend on the cause. Options include doing less work per request, adding capacity, splitting the load, or moving slow work to a \u003ca href=\"#Message%20queue\" data-term=\"Message queue\">message queue\u003c/a> so that it no longer holds up the request.\u003c/p>","avoid":"","usage":["We scaled the API to twenty pods and \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a> didn't change.","Then the API isn't the bottleneck. The database has been pinned at 100% CPU since this morning."],"out":[4,5,29,18,38,3]},{"name":"Single point of failure","section":0,"description":"A component whose failure stops the whole system because nothing else can take over its work.","body":"\u003cp>A single point of failure is a component whose failure stops the whole system because nothing else can take over its work. It may be an obvious part, such as the only database server, or a less visible one, such as a single DNS provider, one expiring TLS certificate, or a configuration service every application reads at startup.\u003c/p>\u003cp>The way to remove one is redundancy: run more than one copy, and have a tested way to move work to a surviving copy.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Failure without redundancy\u003c/th>\u003cth>Common remedy\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>App server\u003c/td>\u003ctd>Site goes down\u003c/td>\u003ctd>Several instances behind a \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Load balancer\u003c/td>\u003ctd>All traffic stops\u003c/td>\u003ctd>Active-passive pair or a managed service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Primary database\u003c/td>\u003ctd>Writes stop\u003c/td>\u003ctd>Standby copy with automatic failover\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Cache\" data-term=\"Cache\">Cache\u003c/a>\u003c/td>\u003ctd>Database takes full load\u003c/td>\u003ctd>Replicated cache, capacity to survive a cold start\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data centre\u003c/td>\u003ctd>Everything in it stops\u003c/td>\u003ctd>Deploy across availability zones (isolated sites)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Redundancy only helps if the copies fail independently. Two servers in one rack share a power feed and a network switch. Two services in different zones may both depend on one authentication service. A design diagram can show everything doubled while a shared dependency remains underneath, and teams often discover it during the outage.\u003c/p>\u003cp>Failover also has to work when it is needed. A standby that has silently fallen behind, or a procedure nobody has run in a year, gives false confidence. Test failover on a schedule by actually removing the component.\u003c/p>\u003cp>Removing every single point of failure is rarely worthwhile. Each layer of redundancy adds cost and operational complexity, and the failover machinery can itself fail. Compare the cost of an outage with the cost of the extra copy, using the availability target from your \u003ca href=\"#Non-functional%20requirement\" data-term=\"Non-functional requirement\">non-functional requirements\u003c/a>.\u003c/p>","avoid":"","usage":["We run three API instances across zones, so we're safe if one goes.","All three read their config from that one Redis box at boot. That's still a single point of failure."],"out":[19,29,1]},{"name":"Read-heavy workload","section":0,"description":"A workload where reads far outnumber writes, which makes caching and read copies effective ways to scale.","body":"\u003cp>A read-heavy workload is one where reads far outnumber writes. Product catalogues, news sites, documentation and social feeds are typical examples, with ratios of 100 reads to one write being common. The ratio matters because reads and writes scale in different ways.\u003c/p>\u003cp>Reads are easier to scale because they do not change anything. The same answer can be copied to many places and served from any of them. The options form a ladder, and each rung adds some complexity:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Add indexes\u003c/td>\u003ctd>Lets the database find rows faster\u003c/td>\u003ctd>Slightly slower writes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Cache\" data-term=\"Cache\">Cache\u003c/a>\u003c/td>\u003ctd>Serves repeated reads from memory\u003c/td>\u003ctd>Data can be stale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#CDN\" data-term=\"CDN\">CDN\u003c/a>\u003c/td>\u003ctd>Serves content from locations near users\u003c/td>\u003ctd>Harder to purge\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read replicas\u003c/td>\u003ctd>Database copies that answer read queries\u003c/td>\u003ctd>Copies can lag the primary\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Precomputed views\u003c/td>\u003ctd>Stores the finished answer ahead of time\u003c/td>\u003ctd>Extra work on each write\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The usual symptom of an unaddressed read-heavy workload is a database at high CPU while running the same few queries thousands of times per second. A \u003ca href=\"#Cache-aside\" data-term=\"Cache-aside\">cache-aside\u003c/a> layer often removes most of that load.\u003c/p>\u003cp>The price of these techniques is staleness. A read replica applies changes shortly after the primary, so a user can save a profile, reload and see the old value because the second request hit a copy that has not caught up. For that case, send a user's reads to the primary for a short period after they write, or read that user's own data from the primary.\u003c/p>\u003cp>Measure the ratio before relying on it. Some workloads that look read-heavy have write bursts, and a \u003ca href=\"#Write-heavy%20workload\" data-term=\"Write-heavy workload\">write-heavy workload\u003c/a> calls for different techniques.\u003c/p>","avoid":"","usage":["The catalogue database is at 90% CPU, should we shard it?","It's a read-heavy workload with about a thousand reads per write. Put a cache in front before splitting anything."],"out":[29,24,31,9]},{"name":"Write-heavy workload","section":0,"description":"A workload dominated by incoming writes, such as logs or sensor data, where caches and read copies give little relief.","body":"\u003cp>A write-heavy workload is one where a large share of the traffic creates or changes data. Metrics collection, application logs, sensor readings, click tracking and chat messages are typical examples.\u003c/p>\u003cp>Writes are harder to scale than reads because each one must reach durable storage and stay correct. A \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> does little to absorb them. Read replicas (database copies that serve queries) do not help either, because every replica has to apply every write, and heavy write load can make those copies fall behind.\u003c/p>\u003cp>The symptoms differ from a read problem. Disk I/O saturates, lock waits climb, replicas lag by minutes, and insert \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a> grows as tables and their indexes get larger. Each index adds work to every insert, so a table with many indexes can be slow to write even when its queries are fast.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technique\u003c/th>\u003cth>How it helps\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Batching\u003c/td>\u003ctd>Groups many rows into one write\u003c/td>\u003ctd>Small delay, larger loss window\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fewer indexes\u003c/td>\u003ctd>Reduces work per insert\u003c/td>\u003ctd>Some queries get slower\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Message%20queue\" data-term=\"Message queue\">Message queue\u003c/a>\u003c/td>\u003ctd>Absorbs bursts ahead of the database\u003c/td>\u003ctd>Data is visible later\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Write-optimised storage\u003c/td>\u003ctd>Appends to disk and merges later (LSM tree)\u003c/td>\u003ctd>Reads can cost more\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Partitioning\u003c/td>\u003ctd>Splits writes across several machines\u003c/td>\u003ctd>Harder queries, rebalancing\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Partitioning needs a well-chosen key. If all writes for the current hour land on one partition, as happens when data is range-partitioned by timestamp, one machine takes the entire load. This hot partition has the same effect as a \u003ca href=\"#Hot%20key\" data-term=\"Hot key\">hot key\u003c/a>. Mixing in a device or user ID spreads the writes.\u003c/p>\u003cp>Check whether every write needs the same guarantee. Losing one click event may be acceptable, while losing a payment is not. Data you can afford to lose can use batching or a \u003ca href=\"#Write-behind%20cache\" data-term=\"Write-behind cache\">write-behind cache\u003c/a>.\u003c/p>","avoid":"","usage":["Replica lag hits ten minutes whenever the sensors report.","It's a write-heavy workload. More replicas won't help, so batch the inserts and drop the indexes nobody uses."],"out":[29,3,38,18,33]},{"name":"Vertical scaling","section":1,"description":"Handling more load by giving one machine more CPU, memory or faster storage, also called scaling up.","body":"\u003cp>Vertical scaling means handling more load by giving one machine more resources: more CPU cores, more memory, faster disks or a faster network card. It is also called scaling up. On a cloud provider it can be as small a change as selecting a larger instance type.\u003c/p>\u003cp>The main advantage is that the software usually does not change. There is no data to split, no coordination between machines, and no new failure modes from network calls. For databases in particular, moving to a larger machine is often the sensible first step, because the alternative of splitting data across servers adds lasting complexity.\u003c/p>\u003cp>Vertical scaling has limits that eventually force a different approach:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Limit\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hardware ceiling\u003c/td>\u003ctd>There is a largest machine you can buy or rent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cost curve\u003c/td>\u003ctd>The largest machines can cost more per unit of capacity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Resize downtime\u003c/td>\u003ctd>Moving to a larger machine often requires a restart\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Availability\u003c/td>\u003ctd>One large machine is still a \u003ca href=\"#Single%20point%20of%20failure\" data-term=\"Single point of failure\">single point of failure\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Software limits\u003c/td>\u003ctd>Locks or single-threaded code may not use the added cores\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last limit is a common surprise. A team moves a service to a 64-core machine and sees no improvement, because one thread is pinned at 100% while the rest sit idle. Before resizing, confirm which resource is the \u003ca href=\"#Bottleneck\" data-term=\"Bottleneck\">bottleneck\u003c/a>. More cores do nothing for a service limited by a lock, and more memory does nothing for one limited by disk writes.\u003c/p>\u003cp>Most production systems combine both directions: \u003ca href=\"#Stateless%20service\" data-term=\"Stateless service\">stateless\u003c/a> application servers grow through \u003ca href=\"#Horizontal%20scaling\" data-term=\"Horizontal scaling\">horizontal scaling\u003c/a>, while the database grows vertically for as long as that remains practical.\u003c/p>","avoid":"","usage":["Do we need to shard the orders database this quarter?","Not yet. Vertical scaling buys us a year or so. Move it to the next instance size and revisit when we're near the top of the range."],"out":[7,6,12,11]},{"name":"Horizontal scaling","section":1,"description":"Handling more load by adding more machines and spreading work across them, also called scaling out.","body":"\u003cp>Horizontal scaling means handling more load by adding more machines and spreading the work across them. It is also called scaling out. Instead of one larger server, you run ten ordinary ones behind a \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a>, and add an eleventh when traffic grows.\u003c/p>\u003cp>The comparison with \u003ca href=\"#Vertical%20scaling\" data-term=\"Vertical scaling\">vertical scaling\u003c/a> is mostly a trade of simplicity for headroom:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>Vertical\u003c/th>\u003cth>Horizontal\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Capacity limit\u003c/td>\u003ctd>Largest available machine\u003c/td>\u003ctd>Much higher, depends on the design\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Code changes\u003c/td>\u003ctd>Usually none\u003c/td>\u003ctd>Must tolerate several running copies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Machine failure\u003c/td>\u003ctd>Full outage\u003c/td>\u003ctd>Lose a fraction of capacity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deploys\u003c/td>\u003ctd>Restart causes downtime\u003c/td>\u003ctd>Replace instances one at a time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Operations\u003c/td>\u003ctd>One machine to manage\u003c/td>\u003ctd>Networking, discovery, partial failures\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Horizontal scaling works well for a \u003ca href=\"#Stateless%20service\" data-term=\"Stateless service\">stateless service\u003c/a>, because any instance can answer any request. State is what makes it hard. If each server keeps sessions in its own memory, a user's next request can land on a server that has never seen them. Databases are harder still, since spreading writes means sharding (splitting data across machines by a key), which complicates queries and transactions.\u003c/p>\u003cp>A common disappointment is adding servers and getting no improvement. If every instance waits on one database, that database is the \u003ca href=\"#Bottleneck\" data-term=\"Bottleneck\">bottleneck\u003c/a>, and extra instances add connections to it. Scaling only helps the part that is actually constrained.\u003c/p>\u003cp>Costs also appear between machines. A process that kept a counter in memory now has several disagreeing counters, and a scheduled job runs once per instance unless something coordinates it. Check for assumptions like these before scaling a service that has only ever run as one copy.\u003c/p>","avoid":"","usage":["Traffic doubles for the sale, can we add API pods?","Yes, the API scales horizontally. The checkout worker doesn't, because it keeps a lock in memory, so fix that before relying on horizontal scaling there."],"out":[19,10,12,6]},{"name":"Stateless service","section":1,"description":"A service that keeps no client data in its own memory between requests, so any instance can handle any request.","body":"\u003cp>A stateless service keeps no client-specific data in its own memory or disk between requests. Everything needed to answer arrives with the request or is fetched from a shared store such as a database. Because of this, any running instance can handle any request.\u003c/p>\u003cp>The state still exists. It has moved out of the application process into something built to hold it:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>State\u003c/th>\u003cth>Stateful version\u003c/th>\u003cth>Stateless version\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Login session\u003c/td>\u003ctd>Object in server memory\u003c/td>\u003ctd>Shared session store or signed token\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shopping cart\u003c/td>\u003ctd>Variable on one instance\u003c/td>\u003ctd>Database row keyed by user\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Uploaded file\u003c/td>\u003ctd>Local disk\u003c/td>\u003ctd>Object storage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Progress of a job\u003c/td>\u003ctd>In-process loop\u003c/td>\u003ctd>Record in a \u003ca href=\"#Message%20queue\" data-term=\"Message queue\">message queue\u003c/a> or database\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The symptom of hidden state is behaviour that depends on which server you reach. Users get logged out at random, a file uploaded a moment ago returns a 404 on refresh, or everything breaks right after a deploy because the restart wiped memory. These faults often appear only once a second instance is added, since a single server hides the problem.\u003c/p>\u003cp>Statelessness is what makes \u003ca href=\"#Horizontal%20scaling\" data-term=\"Horizontal scaling\">horizontal scaling\u003c/a> straightforward. A \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a> can send traffic anywhere, instances can be replaced during a deploy, and a crashed instance loses only the requests it was processing at that moment. Without it, teams often resort to a \u003ca href=\"#Sticky%20session\" data-term=\"Sticky session\">sticky session\u003c/a>, which keeps the problem and adds new ones.\u003c/p>\u003cp>An in-process \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> does not break the model, provided losing it affects only speed. The test is whether an instance can be killed at any moment with no lasting effect on users.\u003c/p>\u003cp>The cost is that each request may need a trip to the shared store, which adds \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a> and makes that store a dependency of every request.\u003c/p>","avoid":"","usage":["Why do people lose their carts every time we deploy?","The cart lives in process memory, so this isn't a stateless service. Move it to Redis and restarts stop mattering."],"out":[38,11,19,13,29,3]},{"name":"Sticky session","section":1,"description":"A load balancer setting that keeps sending one client to the same server, usually because that server holds its session.","body":"\u003cp>A sticky session is a \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a> setting that keeps sending the same client to the same backend server. It is also called session affinity. It is typically used when a server holds something about that client in local memory, such as a login session, and other servers could not answer without it.\u003c/p>\u003cp>There are two common ways to implement it:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>How the client is identified\u003c/th>\u003cth>Weakness\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cookie\u003c/td>\u003ctd>Balancer sets or reads a cookie naming a server\u003c/td>\u003ctd>Requires \u003ca href=\"#Layer%207%20load%20balancing\" data-term=\"Layer 7 load balancing\">layer 7 load balancing\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Source IP\u003c/td>\u003ctd>Balancer hashes the client's IP address\u003c/td>\u003ctd>Many users behind one office or mobile network share an IP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Stickiness makes a stateful application run on several servers with little code change, which is why it is often adopted. The costs show up later. Load becomes uneven, because a few heavy users stay pinned to one instance while others idle. Adding servers does not relieve the busy ones right away, since existing clients stay where they are.\u003c/p>\u003cp>Failure is the most visible problem. When a server crashes or is replaced during a deploy, every user pinned to it loses their session, and people find themselves logged out or with an empty form. Rolling deploys become slower too, because you must either wait for sessions to drain from an instance or accept that those users lose them.\u003c/p>\u003cp>The usual fix is to make the application a \u003ca href=\"#Stateless%20service\" data-term=\"Stateless service\">stateless service\u003c/a> by moving session data to a shared store, or into a signed token held by the client. Stickiness can then be removed.\u003c/p>\u003cp>It still has legitimate uses as an optimisation. Routing a user back to a server with a warm local \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> improves speed, and the system still works correctly if the routing changes.\u003c/p>","avoid":"","usage":["Why are a third of users logged out after each deploy?","We use sticky sessions and keep the session in memory, so restarting a pod logs out everyone pinned to it."],"out":[19,21,12,29]},{"name":"Consistent hashing","section":1,"description":"A way of assigning keys to servers so that adding or removing a server moves only a small share of the keys.","body":"\u003cp>Consistent hashing is a way of assigning keys to servers so that adding or removing a server moves only a small share of the keys. It is used in distributed \u003ca href=\"#Cache\" data-term=\"Cache\">caches\u003c/a> and partitioned data stores, where each key must live on a predictable node.\u003c/p>\u003cp>The simpler approach is \u003ccode>hash(key) % N\u003c/code>, where N is the number of servers. It spreads keys evenly, but changing N changes the result for nearly every key. Going from 4 servers to 5 sends about 80% of keys to a different server. In a cache, that shows up as a sudden collapse in \u003ca href=\"#Cache%20hit%20ratio\" data-term=\"Cache hit ratio\">cache hit ratio\u003c/a> right after someone adds a node, with the database taking the resulting load.\u003c/p>\u003cp>Consistent hashing avoids this by placing both servers and keys on the same circular range of hash values:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Hash each server's name to a position on the ring\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Hash the key to a position on the same ring\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Walk clockwise from the key until you reach a server\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>That server owns the key\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>When a server joins, it takes over only the keys between itself and the previous server on the ring. When one leaves, its keys pass to the next server. Going from 4 to 5 servers moves about 20% of keys.\u003c/p>\u003cp>With a few servers placed at random positions, some arcs of the ring are much longer than others, so load is uneven. The standard fix is virtual nodes: each physical server appears at many positions on the ring. A larger machine can be given more positions.\u003c/p>\u003cp>Consistent hashing balances the number of keys and does nothing about uneven popularity. A single \u003ca href=\"#Hot%20key\" data-term=\"Hot key\">hot key\u003c/a> still lands on one server and can overload it.\u003c/p>","avoid":"","usage":["Every time we add a Redis node, the database gets hammered for ten minutes.","The client is doing modulo hashing, so nearly every key remaps. Switch it to consistent hashing."],"out":[29,30,18]},{"name":"Fan-out","section":1,"description":"One request or message that triggers many downstream calls or copies. The number of targets is the fan-out factor.","body":"\u003cp>Fan-out is when one incoming request or message triggers many downstream calls or copies. A search query sent to 50 index partitions has a fan-out of 50. A post delivered to 10,000 followers has a fan-out of 10,000. The term appears in two main settings.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>What multiplies\u003c/th>\u003cth>Typical example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Request fan-out\u003c/td>\u003ctd>Synchronous calls to other services\u003c/td>\u003ctd>A page calling 12 services to render\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data fan-out\u003c/td>\u003ctd>Copies of a message or record\u003c/td>\u003ctd>One event delivered to many inboxes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Request fan-out has a counter-intuitive effect on \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a>. If a request must wait for all its downstream calls, it is as slow as the slowest one, so rare slowness becomes common. Suppose each backend exceeds one second on 1% of calls. A request that calls 100 of them in parallel has a 1 − 0.99¹⁰⁰ chance, about 63%, of hitting at least one slow response. This is why a page can feel slow when every service's dashboard looks healthy.\u003c/p>\u003cp>Several techniques reduce the effect. Call backends in parallel, give each call a \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeout\u003c/a>, and return partial results when an optional backend is late, which is a form of \u003ca href=\"#Graceful%20degradation\" data-term=\"Graceful degradation\">graceful degradation\u003c/a>. A hedged request sends a duplicate to another replica if the first has not answered after a short delay, and uses whichever reply comes first.\u003c/p>\u003cp>Fan-out also multiplies load. One user action becoming 100 internal calls means a modest traffic increase can overload deep dependencies, and any \u003ca href=\"#Retry%20with%20backoff\" data-term=\"Retry with backoff\">retries\u003c/a> multiply it again.\u003c/p>\u003cp>Data fan-out raises a timing question: do the copying when content is written, or assemble it when someone reads? Those two designs are \u003ca href=\"#Fan-out%20on%20write\" data-term=\"Fan-out on write\">fan-out on write\u003c/a> and \u003ca href=\"#Fan-out%20on%20read\" data-term=\"Fan-out on read\">fan-out on read\u003c/a>.\u003c/p>","avoid":"","usage":["Every service is under 100 ms at p99, but the dashboard page takes three seconds.","It has a fan-out of about 40 calls, partly in sequence. The slow ones add up."],"out":[3,45,50,46,16,17]},{"name":"Fan-out on write","section":1,"description":"Copying new content to every recipient's feed when it is created, so that later reads are fast and already prepared.","body":"\u003cp>\u003ca href=\"#Fan-out\" data-term=\"Fan-out\">Fan-out\u003c/a> on write means copying new content to every recipient's feed at the moment it is created. Each user has a precomputed timeline, usually a list of post IDs in a fast store, and reading it is one lookup. It is one of two ways to build a feed, the other being \u003ca href=\"#Fan-out%20on%20read\" data-term=\"Fan-out on read\">fan-out on read\u003c/a>. Both are forms of data fan-out.\u003c/p>\u003cp>The write path usually runs in the background:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>API\u003c/td>\u003ctd>Saves the post\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>API\u003c/td>\u003ctd>Puts a job on a \u003ca href=\"#Message%20queue\" data-term=\"Message queue\">message queue\u003c/a>, then returns success to the author\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Worker\u003c/td>\u003ctd>Looks up the author's followers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Workers\u003c/td>\u003ctd>Insert the post ID into each follower's stored timeline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Reader\u003c/td>\u003ctd>Fetches their timeline with a single read\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>This suits a \u003ca href=\"#Read-heavy%20workload\" data-term=\"Read-heavy workload\">read-heavy workload\u003c/a>. The expensive work happens once per post, and the many reads that follow are inexpensive and predictable.\u003c/p>\u003cp>The weakness is accounts with very large audiences. One post from an account with 20 million followers creates 20 million timeline writes. The queue backs up, and followers see that post minutes late, while posts from smaller accounts queued behind it are delayed too.\u003c/p>\u003cp>Storage grows as well, since the same post ID is stored once per follower. Systems limit this by keeping only the most recent few hundred entries per timeline and by skipping inactive users. Edits and deletes are also harder, because removing a post means finding every copy, or filtering deleted posts at read time.\u003c/p>\u003cp>Large systems commonly use a hybrid. Ordinary accounts fan out on write, while posts from very large accounts are fetched and merged when a follower reads.\u003c/p>","avoid":"","usage":["Why did the feed queue spike to two million jobs at noon?","A celebrity account posted. With fan-out on write, that's one job per follower, so we should exclude big accounts and merge them at read time."],"out":[15,17,38,8]},{"name":"Fan-out on read","section":1,"description":"Assembling a user's feed at the moment they request it, by fetching and merging recent content from each source.","body":"\u003cp>\u003ca href=\"#Fan-out\" data-term=\"Fan-out\">Fan-out\u003c/a> on read means assembling a user's feed at the moment they request it. Nothing is prepared in advance. When a user opens the app, the service looks up who they follow, fetches recent posts from each account, merges them by time or rank, and returns the result. It is also called the pull model, in contrast to \u003ca href=\"#Fan-out%20on%20write\" data-term=\"Fan-out on write\">fan-out on write\u003c/a>, the push model.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>Fan-out on write\u003c/th>\u003cth>Fan-out on read\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cost of posting\u003c/td>\u003ctd>High, grows with followers\u003c/td>\u003ctd>Low, one insert\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cost of reading\u003c/td>\u003ctd>Low, one lookup\u003c/td>\u003ctd>High, grows with follows\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a>\u003c/td>\u003ctd>Low and steady\u003c/td>\u003ctd>Higher and more variable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>One copy per follower\u003c/td>\u003ctd>One copy of each post\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Freshness\u003c/td>\u003ctd>Delayed by the queue\u003c/td>\u003ctd>Current at read time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Inactive users\u003c/td>\u003ctd>Work wasted on them\u003c/td>\u003ctd>Cost nothing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Very large accounts\u003c/td>\u003ctd>Expensive to post\u003c/td>\u003ctd>No extra cost\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Fan-out on read suits data that is written often and read rarely, and products where most users are inactive on a given day. Deleting a post also takes effect immediately, since no copies exist.\u003c/p>\u003cp>The symptom of this design under load is a slow home screen for the most connected users. Someone who follows 5,000 accounts triggers 5,000 lookups, or a large query across many partitions, every time they refresh. Because the request waits on many sources, it is exposed to the tail-latency effect of fan-out, where one slow partition delays the whole response.\u003c/p>\u003cp>Common mitigations are to \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> the assembled feed for a short time, cap how many sources are read per request, and fetch only the first page. Many large products combine the two approaches: precompute timelines for ordinary accounts, and pull posts from very large accounts during the read.\u003c/p>","avoid":"","usage":["Should we precompute notifications for every workspace member?","Most members never open that tab. Use fan-out on read and cache the result for a minute."],"out":[15,16,3,29]},{"name":"Hot key","section":1,"description":"One key that receives far more traffic than others, overloading the single node that stores it while the rest sit idle.","body":"\u003cp>A hot key is a single key that receives far more traffic than the others, overloading the node that stores it. In a partitioned \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> or database, each key lives on one node or a small set of nodes, so a viral product page or a very popular account sends its traffic to one place regardless of how large the cluster is.\u003c/p>\u003cp>The recognisable symptom is one node at 100% CPU while the others sit at 15%. Cluster-wide averages look healthy, more nodes do not help, and requests touching unrelated keys on the same node also slow down. \u003ca href=\"#Consistent%20hashing\" data-term=\"Consistent hashing\">Consistent hashing\u003c/a> does not prevent this, because it balances how many keys each node owns and takes no account of how popular each key is.\u003c/p>\u003cp>Hot keys are found by sampling per-key traffic. Redis, for example, offers \u003ccode>redis-cli --hotkeys\u003c/code> when an LFU \u003ca href=\"#Eviction%20policy\" data-term=\"Eviction policy\">eviction policy\u003c/a> is configured.\u003c/p>\u003cp>The fix depends on whether the traffic is reads or writes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technique\u003c/th>\u003cth>Works for\u003c/th>\u003cth>How it helps\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Local in-process cache\u003c/td>\u003ctd>Reads\u003c/td>\u003ctd>Each app server keeps the value for a second or two\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Replicate the key\u003c/td>\u003ctd>Reads\u003c/td>\u003ctd>Several nodes hold copies and share the requests\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Key splitting\u003c/td>\u003ctd>Reads\u003c/td>\u003ctd>Store copies as \u003ccode>item:1\u003c/code>, \u003ccode>item:2\u003c/code> and pick one at random\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Counter splitting\u003c/td>\u003ctd>Writes\u003c/td>\u003ctd>Increment one of N sub-counters and sum them on read\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Write batching\u003c/td>\u003ctd>Writes\u003c/td>\u003ctd>Combine many updates in the app before writing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dedicated node\u003c/td>\u003ctd>Both\u003c/td>\u003ctd>Move the key to hardware of its own\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A one-second local cache limits each app server to about one fetch per second for that key.\u003c/p>\u003cp>A hot key that expires is a further risk. Every request misses simultaneously and goes to the database, producing a \u003ca href=\"#Cache%20stampede\" data-term=\"Cache stampede\">cache stampede\u003c/a>.\u003c/p>","avoid":"","usage":["Redis shard 7 is maxed out and the other eleven are idle.","That's a hot key, probably the homepage banner. Add a short local cache in the app."],"out":[29,14,36,37]},{"name":"Load balancer","section":2,"description":"A component that spreads incoming requests across a group of servers and stops sending traffic to unhealthy ones.","body":"\u003cp>A load balancer is a component that receives incoming requests and spreads them across a group of backend servers. Clients see one address, while several instances do the work. This is what makes \u003ca href=\"#Horizontal%20scaling\" data-term=\"Horizontal scaling\">horizontal scaling\u003c/a> possible for a web service, and it lets you replace instances during a deploy without clients noticing.\u003c/p>\u003cp>The balancer chooses a backend using an algorithm:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Algorithm\u003c/th>\u003cth>How it picks\u003c/th>\u003cth>Suits\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Round robin\u003c/td>\u003ctd>Each server in turn\u003c/td>\u003ctd>Similar servers, similar requests\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weighted round robin\u003c/td>\u003ctd>In turn, in proportion to assigned weights\u003c/td>\u003ctd>Servers of different sizes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Least connections\u003c/td>\u003ctd>Server with the fewest active connections\u003c/td>\u003ctd>Requests of varying duration\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hash\u003c/td>\u003ctd>Same client or key goes to the same server\u003c/td>\u003ctd>Affinity, local \u003ca href=\"#Cache\" data-term=\"Cache\">caches\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Power of two choices\u003c/td>\u003ctd>Samples two at random, takes the less busy\u003c/td>\u003ctd>Large fleets, several balancers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Balancers operate at different levels. \u003ca href=\"#Layer%204%20load%20balancing\" data-term=\"Layer 4 load balancing\">Layer 4 load balancing\u003c/a> routes network connections without reading their content, while \u003ca href=\"#Layer%207%20load%20balancing\" data-term=\"Layer 7 load balancing\">layer 7 load balancing\u003c/a> reads each HTTP request and can route on its path or headers.\u003c/p>\u003cp>Health checks decide which instances receive traffic, and they cause two familiar problems. A shallow check that only confirms the process is running can keep returning 200 while real requests fail, so users keep hitting a broken instance. A deep check that also tests the shared database has the opposite risk: one database blip marks every instance unhealthy at once, and the balancer may have nowhere to send traffic. A common compromise is to check what the instance itself needs to function and handle shared dependency failures separately.\u003c/p>\u003cp>The balancer sits on every request, so it can become a \u003ca href=\"#Single%20point%20of%20failure\" data-term=\"Single point of failure\">single point of failure\u003c/a>. Run it as a redundant pair or use a managed service.\u003c/p>","avoid":"","usage":["Why are 25% of requests failing when only one of four pods is broken?","Its health endpoint still returns 200, so the load balancer keeps sending it traffic."],"out":[11,29,20,21,7]},{"name":"Layer 4 load balancing","section":2,"description":"Distributing network connections using only IP addresses and ports, without reading the data inside them.","body":"\u003cp>Layer 4 load balancing distributes network connections using only IP addresses, ports and the protocol, without reading the data inside them. The name comes from the transport layer, layer 4 of the OSI networking model, which is where TCP and UDP sit. The \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a> picks a backend when a connection opens, and every packet in that connection then goes to the same backend.\u003c/p>\u003cp>Not parsing the content has these consequences:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>Consequence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>No parsing of application data\u003c/td>\u003ctd>Low overhead per connection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Works with any TCP or UDP protocol\u003c/td>\u003ctd>Suits databases, message brokers, game traffic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Encrypted traffic passes through\u003c/td>\u003ctd>TLS can stay end-to-end, up to the backend\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sees no URL, header or cookie\u003c/td>\u003ctd>Cannot route by path or user\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Decides once per connection\u003c/td>\u003ctd>Balances connections, not requests\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last property causes a well-known problem with long-lived connections. HTTP/2 and gRPC (a remote procedure call framework) send many requests over one connection. A layer 4 balancer sees one connection and pins it to one backend, so a busy client can load one server heavily while others sit idle.\u003c/p>\u003cp>The same effect shows up during scaling. You add three new pods, and they receive almost no traffic, because existing clients keep their open connections to the old pods.\u003c/p>\u003cp>There are three usual fixes. Set a maximum connection age so clients reconnect and spread out over time. Use client-side balancing, where the client holds connections to several backends. Or move to \u003ca href=\"#Layer%207%20load%20balancing\" data-term=\"Layer 7 load balancing\">layer 7 load balancing\u003c/a>, which balances each request individually.\u003c/p>\u003cp>Layer 4 remains a good fit for non-HTTP protocols and very high connection counts. AWS Network Load Balancer and HAProxy in TCP mode are examples.\u003c/p>","avoid":"","usage":["We scaled gRPC to ten pods, but three of them are doing all the work.","The service is behind layer 4 load balancing, so each connection is stuck to one pod. Set a max connection age."],"out":[19,21]},{"name":"Layer 7 load balancing","section":2,"description":"Distributing individual requests by reading application data such as the URL path, headers and cookies.","body":"\u003cp>Layer 7 load balancing distributes individual requests by reading application data such as the URL path, headers and cookies. The name refers to the application layer of the OSI networking model, where HTTP sits. The \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a> ends the client's connection, reads the request, chooses a backend, and sends the request over its own connection. In this role it is a type of \u003ca href=\"#Reverse%20proxy\" data-term=\"Reverse proxy\">reverse proxy\u003c/a>.\u003c/p>\u003cp>Reading the request allows routing rules that lower layers cannot express. \u003ccode>/api/*\u003c/code> can go to one service and \u003ccode>/images/*\u003c/code> to another, a header can send 5% of users to a canary release (a small trial deployment), and a cookie can support a \u003ca href=\"#Sticky%20session\" data-term=\"Sticky session\">sticky session\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>\u003ca href=\"#Layer%204%20load%20balancing\" data-term=\"Layer 4 load balancing\">Layer 4\u003c/a>\u003c/th>\u003cth>Layer 7\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Routes on\u003c/td>\u003ctd>IP address and port\u003c/td>\u003ctd>Path, host, headers, cookies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Balances\u003c/td>\u003ctd>Connections\u003c/td>\u003ctd>Individual requests\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protocols\u003c/td>\u003ctd>Any TCP or UDP\u003c/td>\u003ctd>Those it can parse, such as HTTP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TLS\u003c/td>\u003ctd>Can pass through\u003c/td>\u003ctd>Usually terminated here\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Overhead\u003c/td>\u003ctd>Lower\u003c/td>\u003ctd>Higher\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Request retries, header edits\u003c/td>\u003ctd>Not available\u003c/td>\u003ctd>Supported\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The cost is more work per request. The balancer must decrypt traffic, parse it and hold state for two connections, and it needs access to your TLS private keys. It also adds its own limits, which produce confusing failures. A file upload that works locally returns 413 in production because of a body-size limit on the balancer. A long report returns 504 because the balancer's \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeout\u003c/a> is shorter than the application's. When an error never appears in your application logs, check the balancer's logs.\u003c/p>\u003cp>Automatic retries at this layer need care. Retrying a failed POST can apply it twice unless the operation is idempotent, meaning repeating it has the same effect as doing it once.\u003c/p>\u003cp>NGINX, Envoy and AWS Application Load Balancer are common examples.\u003c/p>","avoid":"","usage":["Can we send only \u003ccode>/search\u003c/code> traffic to the new service?","Yes, the ingress does layer 7 load balancing, so it's one path rule."],"out":[19,22,13,20,45]},{"name":"Reverse proxy","section":2,"description":"A server that sits in front of backend servers, receives client requests on their behalf, and forwards them.","body":"\u003cp>A reverse proxy is a server that sits in front of one or more backend servers, receives client requests on their behalf, and forwards them. The client talks only to the proxy and usually cannot tell what is behind it. A forward proxy is the mirror image: it acts for clients, for example a company proxy that controls outbound web access.\u003c/p>\u003cp>Putting one component at the entrance lets it handle work that every backend would otherwise repeat:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Job\u003c/th>\u003cth>What the proxy does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TLS termination\u003c/td>\u003ctd>Handles HTTPS so backends can receive decrypted traffic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Routing\u003c/td>\u003ctd>Sends paths or hostnames to different services\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Balancing\u003c/td>\u003ctd>Spreads requests, acting as a \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Cache\" data-term=\"Cache\">Caching\u003c/a>\u003c/td>\u003ctd>Stores responses and serves repeats\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Compression\u003c/td>\u003ctd>Shrinks responses before sending them\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Buffering\u003c/td>\u003ctd>Absorbs slow clients so backend workers are freed quickly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Static files\u003c/td>\u003ctd>Serves assets without involving the application\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The proxy also introduces a class of errors that can confuse debugging. A 502 Bad Gateway means the proxy got an invalid response or no usable connection from the backend, often because the application crashed or is not listening. A 504 Gateway \u003ca href=\"#Timeout\" data-term=\"Timeout\">Timeout\u003c/a> means the backend did not answer within the proxy's time limit. In both cases the error page comes from the proxy, so the application's logs may show nothing, or show a request that completed successfully after the proxy gave up.\u003c/p>\u003cp>Another common surprise is that every request appears to come from the proxy's IP address. Proxies pass the original address in a header such as \u003ccode>X-Forwarded-For\u003c/code>. Clients can forge that header, so trust only the values added by your own proxies, particularly for \u003ca href=\"#Rate%20limiting\" data-term=\"Rate limiting\">rate limiting\u003c/a> and audit logs.\u003c/p>\u003cp>NGINX, HAProxy, Caddy and Envoy are examples. An \u003ca href=\"#API%20gateway\" data-term=\"API gateway\">API gateway\u003c/a> is a reverse proxy with API-specific features added.\u003c/p>","avoid":"","usage":["Users get a 502, but there's nothing in the app logs.","The reverse proxy generates that. The app probably crashed and restarted, so check for container restarts."],"out":[19,29,45,26,23]},{"name":"API gateway","section":2,"description":"A single entry point for API clients that handles routing, authentication, rate limits and other shared request concerns.","body":"\u003cp>An API gateway is a single entry point for API clients that routes each request to the right backend service and handles concerns shared by all of them. It is a specialised \u003ca href=\"#Reverse%20proxy\" data-term=\"Reverse proxy\">reverse proxy\u003c/a>. It is common in \u003ca href=\"#Microservices\" data-term=\"Microservices\">microservices\u003c/a>, where clients would otherwise need to know the address and rules of many separate services.\u003c/p>\u003cp>Without on
