e, each service reimplements login checks and limits, usually with small differences. One team's endpoint ends up with weaker validation, or a security fix has to ship in twelve places. A gateway puts those rules in one layer.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>What the gateway does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Routing\u003c/td>\u003ctd>Maps public paths to internal services\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authentication\u003c/td>\u003ctd>Validates tokens or API keys before forwarding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Rate%20limiting\" data-term=\"Rate limiting\">Rate limiting\u003c/a>\u003c/td>\u003ctd>Enforces quotas per client or plan\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transformation\u003c/td>\u003ctd>Rewrites headers, paths or payload formats\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Versioning\u003c/td>\u003ctd>Sends \u003ccode>/v1\u003c/code> and \u003ccode>/v2\u003c/code> to different backends\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Observability\u003c/td>\u003ctd>Records logs and metrics for every call\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The neighbouring components overlap. A \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a> spreads traffic across copies of one service. A reverse proxy forwards traffic and handles generic HTTP work. An API gateway adds knowledge of API consumers, such as who is calling and what plan they are on.\u003c/p>\u003cp>The main risk is logic creep. Teams add business rules, data joins and special cases to the gateway because it is convenient, and it becomes a shared component that every release depends on and one team must approve. Keep rules about the product inside services, and keep the gateway to cross-cutting concerns. If different clients need different response shapes, a \u003ca href=\"#Backend%20for%20frontend\" data-term=\"Backend for frontend\">backend for frontend\u003c/a> is a better location.\u003c/p>\u003cp>The gateway also adds a network hop and sits on every request, so a bad configuration change can take down all APIs at once. Kong and Amazon API Gateway are examples.\u003c/p>","avoid":"","usage":["Should the discount calculation go in a gateway plugin? It's the one place every request passes through.","No, that's business logic. Keep the API gateway to auth, routing and quotas."],"out":[22,55,26,19,61]},{"name":"CDN","section":2,"description":"A content delivery network, a set of servers in many locations that cache content close to users.","body":"\u003cp>A CDN, or content delivery network, is a set of servers in many geographic locations that \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> content close to users. Those servers are called the edge. Your own server is called the origin. A user in Tokyo can get an image from a nearby edge location instead of an origin in Virginia, which lowers \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a> and origin load.\u003c/p>\u003cp>A request moves through these steps:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Network\u003c/td>\u003ctd>DNS or network routing sends the user to a nearby edge location\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Edge\u003c/td>\u003ctd>Looks up the response by its cache key, usually the URL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Edge\u003c/td>\u003ctd>On a hit, returns the stored copy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Origin\u003c/td>\u003ctd>On a miss, receives the request and returns the response\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Edge\u003c/td>\u003ctd>Stores it according to its \u003ccode>Cache-Control\u003c/code> headers, then responds\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>CDNs suit images, video, scripts and stylesheets, and can also cache API responses that are the same for many users.\u003c/p>\u003cp>The familiar failure is stale content. You deploy a fix and some users still get the old stylesheet, because edge locations hold it until its \u003ca href=\"#TTL\" data-term=\"TTL\">TTL\u003c/a> expires. Purging helps but takes time to reach every location and does not clear browser caches. A more dependable method is to put a content hash in the filename, such as \u003ccode>app.3f9c2.css\u003c/code>. Each release then has a new URL, and the file can be cached for a long time.\u003c/p>\u003cp>A more serious failure is caching personalised content. If an account page is cached under a URL shared by all users, one person can receive another's data. Mark such responses \u003ccode>Cache-Control: private\u003c/code> or \u003ccode>no-store\u003c/code>, and make sure the cache key includes anything the response varies on.\u003c/p>\u003cp>Cloudflare, Amazon CloudFront and Fastly are examples.\u003c/p>","avoid":"","usage":["I shipped the CSS fix an hour ago, but customers still see the broken layout.","The CDN is still serving the old file. We need hashed filenames so each release gets a new URL."],"out":[29,3,35]},{"name":"Service discovery","section":2,"description":"The mechanism services use to find the current network addresses of the other services they call.","body":"\u003cp>Service discovery is the mechanism services use to find the current network addresses of the services they call. Hard-coded addresses stop working once instances are created and destroyed by autoscaling and deploys, because each new instance can have a different IP. A discovery system maintains a live list of healthy instances under a stable service name, such as \u003ccode>payments\u003c/code>.\u003c/p>\u003cp>The list lives in a registry. Instances either register themselves on startup or are registered by the platform, and health checks remove those that stop responding. Callers then reach an instance in one of three ways:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>How a caller finds an instance\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DNS-based\u003c/td>\u003ctd>Resolves the service name to one or more IPs\u003c/td>\u003ctd>Simple, but resolvers and clients \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> old records\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client-side\u003c/td>\u003ctd>Fetches the list from the registry and picks an instance itself\u003c/td>\u003ctd>No extra hop, but logic in every client\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Server-side\u003c/td>\u003ctd>Calls a stable address, and a \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a> picks\u003c/td>\u003ctd>Simple clients, one more hop\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Kubernetes Services and Consul are examples.\u003c/p>\u003cp>The usual symptom of a discovery problem is a burst of connection errors during every deploy. An old pod has shut down, but callers still hold its address for a few seconds, or longer if a client caches DNS results for too long and ignores the record's \u003ca href=\"#TTL\" data-term=\"TTL\">TTL\u003c/a>. To reduce this, have an instance leave the registry first, keep serving during a short draining period, and only then exit. Callers should also retry a failed connection on a different instance.\u003c/p>\u003cp>The registry becomes a dependency of nearly everything, so an outage there can spread widely. Run it with redundancy, and have clients keep using their last known list of addresses if the registry cannot be reached.\u003c/p>","avoid":"","usage":["Every rollout gives us thirty seconds of connection refused from the orders service.","Pods exit before service discovery removes them. Add a pre-stop delay so they drain first."],"out":[29,19,35]},{"name":"Rate limiting","section":2,"description":"Capping how many requests a client can make in a period of time and rejecting the excess, usually with HTTP 429.","body":"\u003cp>Rate limiting caps how many requests a client can make in a period of time and rejects the excess. A rule might allow 100 requests per minute per API key. It protects a service from abusive clients, buggy scripts stuck in a loop, and one tenant using capacity that others need. Rejected HTTP requests normally receive a 429 Too Many Requests status, often with a \u003ccode>Retry-After\u003c/code> header saying when to try again.\u003c/p>\u003cp>Several algorithms can enforce the limit:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Algorithm\u003c/th>\u003cth>How it counts\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fixed window\u003c/td>\u003ctd>Counter per calendar minute\u003c/td>\u003ctd>Allows a double burst at the edge\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sliding log\u003c/td>\u003ctd>Stores a timestamp per request\u003c/td>\u003ctd>Exact, but uses more memory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Sliding%20window%20counter\" data-term=\"Sliding window counter\">Sliding window counter\u003c/a>\u003c/td>\u003ctd>Weights two adjacent counters\u003c/td>\u003ctd>Approximate, low memory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Token%20bucket\" data-term=\"Token bucket\">Token bucket\u003c/a>\u003c/td>\u003ctd>Spends tokens that refill steadily\u003c/td>\u003ctd>Permits controlled bursts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Leaky bucket\u003c/td>\u003ctd>Drains a queue at a fixed rate\u003c/td>\u003ctd>Smooth output, adds waiting\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Identifying the client needs thought. Limiting by IP address punishes everyone behind one office network or mobile carrier, so a whole company can receive 429s because of one colleague's script. Prefer an API key or user ID, and keep IP limits for unauthenticated endpoints such as login.\u003c/p>\u003cp>Running several instances introduces a common bug. If each instance counts on its own, a limit of 100 per minute across three instances really allows 300. A shared store such as Redis fixes this, provided the check and increment happen atomically. You also need to decide what happens when that store is down: allow traffic and lose protection, or reject it and cause an outage.\u003c/p>\u003cp>Rate limiting differs from \u003ca href=\"#Load%20shedding\" data-term=\"Load shedding\">load shedding\u003c/a>. Rate limiting enforces a per-client quota even when the system is healthy, while load shedding drops work because the system as a whole is overloaded.\u003c/p>","avoid":"","usage":["A partner's sync job is eating half of our API capacity.","Add rate limiting per API key and return \u003ccode>Retry-After\u003c/code>, so their client backs off."],"out":[28,27,51]},{"name":"Token bucket","section":2,"description":"A rate limiting algorithm where requests spend tokens that refill at a steady rate, allowing short bursts up to a set size.","body":"\u003cp>A token bucket is a \u003ca href=\"#Rate%20limiting\" data-term=\"Rate limiting\">rate limiting\u003c/a> algorithm in which each request spends a token from a bucket that refills at a steady rate. It has two settings: capacity, the most tokens the bucket can hold, and refill rate, how many tokens are added per second. Capacity controls the size of a burst, and refill rate controls the sustained average.\u003c/p>\u003cp>Take a bucket with a capacity of 20 and a refill rate of 5 tokens per second:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Time\u003c/th>\u003cth>Event\u003c/th>\u003cth>Tokens after\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0 s\u003c/td>\u003ctd>Client has been idle\u003c/td>\u003ctd>20\u003c/td>\u003ctd>Bucket is full\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0 s\u003c/td>\u003ctd>20 requests arrive\u003c/td>\u003ctd>0\u003c/td>\u003ctd>All allowed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0 s\u003c/td>\u003ctd>1 more request\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Rejected\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 s\u003c/td>\u003ctd>5 tokens added\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Refilled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 s\u003c/td>\u003ctd>8 requests arrive\u003c/td>\u003ctd>0\u003c/td>\u003ctd>5 allowed, 3 rejected\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>This burst behaviour suits real clients. A page load may fire ten API calls at once and then go quiet. A strict per-second limit would reject part of that page even though the user's average rate is low. A token bucket lets it through and still holds the long-run rate.\u003c/p>\u003cp>Implementations do not need a timer adding tokens. Store only the token count and the last update time. On each request, compute \u003ccode>tokens = min(capacity, tokens + elapsed × rate)\u003c/code>, then subtract one if at least one token is available. Across several servers, this read-and-update has to be atomic, for example through a Lua script in Redis. Otherwise two concurrent requests can spend the same token.\u003c/p>\u003cp>Choosing the capacity is the main tuning decision. If it is too small, normal bursts receive 429 errors even though the client is under its average limit. If it is too large, many clients can burst together and still overload the backend.\u003c/p>","avoid":"","usage":["Customers get 429s on dashboard load, but they're well under 300 requests a minute.","The page sends 40 calls at once. Use a token bucket with a burst capacity of 50."],"out":[26]},{"name":"Sliding window counter","section":2,"description":"A rate limiting algorithm that estimates recent traffic by weighting the counts of the current and previous time windows.","body":"\u003cp>A sliding window counter is a \u003ca href=\"#Rate%20limiting\" data-term=\"Rate limiting\">rate limiting\u003c/a> algorithm that estimates recent traffic by combining the counts of the current and previous fixed time windows. It uses about as little memory as a plain counter and reduces that counter's main flaw.\u003c/p>\u003cp>The flaw is the boundary burst. A fixed window limit of 100 requests per minute resets at the top of each minute. A client can send 100 requests at 12:00:59 and another 100 at 12:01:00. Each window is within its limit, yet the backend receives 200 requests in about one second, double the intended rate.\u003c/p>\u003cp>The sliding window counter keeps two numbers per client and weights the older one by how much of it still overlaps the last 60 seconds:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Calculation\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Count in the previous window\u003c/td>\u003ctd>80\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Count so far in the current window\u003c/td>\u003ctd>30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Position in the current window\u003c/td>\u003ctd>15 s of 60 s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Share of previous window still in range\u003c/td>\u003ctd>1 − 15/60 = 75%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Estimate = previous × share + current\u003c/td>\u003ctd>80 × 0.75 + 30 = 90\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Compare with the limit of 100\u003c/td>\u003ctd>Allowed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The estimate assumes requests in the previous window were spread evenly. When they were bunched at one end, the estimate can be far off: a client can fit nearly twice the limit into a rolling window, or is rejected after a minute of sending nothing. On evenly spread traffic the error is small. For quotas and abuse protection that error is normally acceptable. A sliding log is exact, at a higher memory cost.\u003c/p>\u003cp>Compared with a \u003ca href=\"#Token%20bucket\" data-term=\"Token bucket\">token bucket\u003c/a>, this algorithm expresses a limit directly as &quot;N per window&quot; and does not grant an explicit burst allowance.\u003c/p>","avoid":"","usage":["Clients are doubling their quota by bursting right around the minute mark.","That's the fixed window edge. Switch to a sliding window counter, which only needs one extra integer per client."],"out":[26,27]},{"name":"Cache","section":3,"description":"A fast store holding copies of data so that repeated requests can avoid a slower source such as a database.","body":"\u003cp>A cache is a fast store that holds copies of data so that repeated requests can avoid a slower source, such as a database, a disk or a remote service. When the requested item is present, that is a hit. When it is absent, that is a miss, and the data must be fetched from the source. Caching works because access is usually uneven, with a small share of the data receiving a large share of the requests.\u003c/p>\u003cp>Caches exist at several levels of a typical system:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Where it lives\u003c/th>\u003cth>Typical contents\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Browser\u003c/td>\u003ctd>User's device\u003c/td>\u003ctd>Images, scripts, stylesheets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#CDN\" data-term=\"CDN\">CDN\u003c/a>\u003c/td>\u003ctd>Edge locations near users\u003c/td>\u003ctd>Static files, public pages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Reverse%20proxy\" data-term=\"Reverse proxy\">Reverse proxy\u003c/a>\u003c/td>\u003ctd>In front of app servers\u003c/td>\u003ctd>Whole HTTP responses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>In-process\u003c/td>\u003ctd>Application memory\u003c/td>\u003ctd>Config, small lookup tables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Distributed\u003c/td>\u003ctd>Redis or Memcached\u003c/td>\u003ctd>Sessions, query results\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Database\u003c/td>\u003ctd>Database memory\u003c/td>\u003ctd>Recently used data pages\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Every cache design answers three questions. How does data get in, for example \u003ca href=\"#Cache-aside\" data-term=\"Cache-aside\">cache-aside\u003c/a> or a \u003ca href=\"#Write-through%20cache\" data-term=\"Write-through cache\">write-through cache\u003c/a>? How long does it stay, as set by a \u003ca href=\"#TTL\" data-term=\"TTL\">TTL\u003c/a> and an \u003ca href=\"#Eviction%20policy\" data-term=\"Eviction policy\">eviction policy\u003c/a>? How is it corrected when the source changes, which is \u003ca href=\"#Cache%20invalidation\" data-term=\"Cache invalidation\">cache invalidation\u003c/a>?\u003c/p>\u003cp>Two failures are common. The first is stale data: a user changes their address, and the old one keeps appearing because a cached copy outlived the change. The second is hidden dependence. A database is sized for the traffic left over after the cache, so when the cache restarts empty, the database receives the full load in a \u003ca href=\"#Cache%20stampede\" data-term=\"Cache stampede\">cache stampede\u003c/a> and can go down. A cache that was added to improve speed has become necessary for availability.\u003c/p>\u003cp>Treat a cache as a copy that can vanish at any time, and track its \u003ca href=\"#Cache%20hit%20ratio\" data-term=\"Cache hit ratio\">cache hit ratio\u003c/a>. Test what happens when it is empty.\u003c/p>","avoid":"","usage":["Can we restart the Redis cluster during the day?","Not safely. The cache absorbs about 95% of reads, and the database can't take that load cold."],"out":[24,22,31,32,35,36,34,37,30]},{"name":"Cache hit ratio","section":3,"description":"The share of lookups a cache answers without going to the source, calculated as hits divided by total lookups.","body":"\u003cp>\u003ca href=\"#Cache\" data-term=\"Cache\">Cache\u003c/a> hit ratio is the share of lookups that a cache answers without going to the underlying source. It is calculated as hits divided by hits plus misses. A cache that answers 950 of 1,000 lookups has a hit ratio of 95%.\u003c/p>\u003cp>The number that matters for capacity is the miss ratio, because misses are what reach the database. Small changes near the top of the scale have large effects:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Hit ratio\u003c/th>\u003cth>Requests reaching the database, per 10,000\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>90%\u003c/td>\u003ctd>1,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>95%\u003c/td>\u003ctd>500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99%\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99.9%\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A drop from 99% to 98% looks minor on a dashboard, yet it doubles database load. This is why a small change, such as a new field in the cache key or a shorter \u003ca href=\"#TTL\" data-term=\"TTL\">TTL\u003c/a>, can produce a database incident with no increase in traffic.\u003c/p>\u003cp>Hit ratio also drives average \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a>. If a hit takes 1 ms and a miss costs 1 ms for the check plus 50 ms for the database, a 90% hit ratio averages 6 ms and a 99% ratio averages 1.5 ms.\u003c/p>\u003cp>Several things commonly lower the ratio: keys that include a timestamp or request ID, so that nothing repeats; a cache too small for its working set, the data in regular use; and restarts or deploys that leave the cache empty. Adding nodes with naive hashing has the same effect, which \u003ca href=\"#Consistent%20hashing\" data-term=\"Consistent hashing\">consistent hashing\u003c/a> avoids.\u003c/p>\u003cp>Read the number with care. A single overall ratio can hide one important endpoint at 40% behind many trivial lookups at 99.9%, so measure it per key type. A high ratio also says nothing about whether the data served is correct.\u003c/p>","avoid":"","usage":["Database CPU doubled after the release, but traffic is flat.","Cache hit ratio fell from 99 to 98. The new locale field in the key split every entry."],"out":[29,35,3,14]},{"name":"Cache-aside","section":3,"description":"A caching pattern where the application checks the cache, loads from the database on a miss, and stores the result.","body":"\u003cp>\u003ca href=\"#Cache\" data-term=\"Cache\">Cache\u003c/a>-aside is a caching pattern in which the application manages the cache itself, loading data into it only when that data is requested. It is also called lazy loading. The cache sits beside the database and has no connection to it.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Path\u003c/th>\u003cth>What the application does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Read\u003c/td>\u003ctd>Looks up the key in the cache\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Read\u003c/td>\u003ctd>On a hit, returns the value\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Read\u003c/td>\u003ctd>On a miss, queries the database\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Read\u003c/td>\u003ctd>Stores the result in the cache and returns it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Write\u003c/td>\u003ctd>Updates the database\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Write\u003c/td>\u003ctd>Deletes the key from the cache\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The pattern has useful properties. Only requested data takes up cache memory, and if the cache goes down, reads can still reach the database, at the price of more load on it.\u003c/p>\u003cp>Writes delete the key instead of updating it because concurrent updates can land in the wrong order and leave an old value in place. Deleting forces the next reader to load the current value.\u003c/p>\u003cp>A race remains. Reader A misses and fetches the old row. Writer B updates the database and deletes the key. Reader A then stores the old value it fetched earlier. The cache now holds stale data with nothing scheduled to remove it, which is how a record can stay wrong for hours and then correct itself. Always set a \u003ca href=\"#TTL\" data-term=\"TTL\">TTL\u003c/a> as a backstop, so that any such error has a limited lifetime.\u003c/p>\u003cp>Each miss costs three trips: cache, database, cache. After a deploy or restart everything misses at once, and a popular key that expires can cause a \u003ca href=\"#Cache%20stampede\" data-term=\"Cache stampede\">cache stampede\u003c/a>. For data that must be current right after a write, compare a \u003ca href=\"#Write-through%20cache\" data-term=\"Write-through cache\">write-through cache\u003c/a>.\u003c/p>","avoid":"","usage":["One customer's plan shows the old tier, but the database row is right.","That's the cache-aside race. The TTL is a week, so shorten it and delete that key by hand."],"out":[29,35,37,32]},{"name":"Write-through cache","section":3,"description":"A cache where each write goes to both the cache and the database before the write is confirmed to the caller.","body":"\u003cp>A write-through \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> is one where each write goes to both the cache and the backing database before the caller receives confirmation. Because the two are updated as part of one operation, a read that follows a successful write finds the new value in the cache.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>App\u003c/td>\u003ctd>Sends the write to the cache layer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Cache\u003c/td>\u003ctd>Stores the new value\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Cache\u003c/td>\u003ctd>Writes the value to the database and waits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Database\u003c/td>\u003ctd>Confirms the write\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Cache\u003c/td>\u003ctd>Confirms success to the app\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Some products provide this behaviour directly. With a plain store such as Redis, the application usually performs both writes itself, which gives weaker guarantees, because a crash between the two leaves them different.\u003c/p>\u003cp>This pattern addresses a common complaint with \u003ca href=\"#Cache-aside\" data-term=\"Cache-aside\">cache-aside\u003c/a>: a user saves a change and the next read is a miss or returns something old. Recently written data is already cached, so reads of recent data are fast and current.\u003c/p>\u003cp>The costs fall on the write path. Each write now waits for two systems, so write \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a> is at least that of the database, and it does nothing to reduce database write load. A \u003ca href=\"#Write-heavy%20workload\" data-term=\"Write-heavy workload\">write-heavy workload\u003c/a> gets little benefit. The cache also fills with data that may never be read, such as records created once and left alone, so pair it with a \u003ca href=\"#TTL\" data-term=\"TTL\">TTL\u003c/a> or an \u003ca href=\"#Eviction%20policy\" data-term=\"Eviction policy\">eviction policy\u003c/a>.\u003c/p>\u003cp>Failure handling needs a decision. If the database write fails, the cached value must be removed or never exposed, or readers will see data that was never saved. Other systems that write directly to the database also bypass the cache and leave it stale, so route all writes through the same path.\u003c/p>","avoid":"","usage":["Users edit their profile and sometimes see the old name for a few seconds.","Profile reads vastly outnumber edits, so a write-through cache fits. The extra few milliseconds on save won't matter."],"out":[29,31,3,9,35,36]},{"name":"Write-behind cache","section":3,"description":"A cache that confirms a write immediately and saves it to the database later, trading durability for write speed.","body":"\u003cp>A write-behind \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> confirms a write as soon as it holds the value, then saves it to the database later in the background. It is also called a write-back cache. The caller gets a fast response, and the database receives the change some time afterwards.\u003c/p>\u003cp>The three common write strategies differ in when the database is updated:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Pattern\u003c/th>\u003cth>Database updated\u003c/th>\u003cth>Write speed\u003c/th>\u003cth>Risk of data loss\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Cache-aside\" data-term=\"Cache-aside\">Cache-aside\u003c/a>\u003c/td>\u003ctd>By the app, on write\u003c/td>\u003ctd>Database speed\u003c/td>\u003ctd>Low\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Write-through%20cache\" data-term=\"Write-through cache\">Write-through\u003c/a>\u003c/td>\u003ctd>Before confirming\u003c/td>\u003ctd>Database speed plus cache\u003c/td>\u003ctd>Low\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Write-behind\u003c/td>\u003ctd>After confirming\u003c/td>\u003ctd>Cache speed\u003c/td>\u003ctd>Higher\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Delaying the write allows batching and combining. If a view counter is incremented 1,000 times in ten seconds, the cache can send one update with the final value. This reduces database load, which makes the pattern attractive for a \u003ca href=\"#Write-heavy%20workload\" data-term=\"Write-heavy workload\">write-heavy workload\u003c/a> such as counters, analytics or game state.\u003c/p>\u003cp>The cost is durability. A write that was confirmed to the user exists only in the cache until it is flushed. If that node dies first, the write is gone, even though the client was told it succeeded. Replicating the cache or keeping a durable log of pending writes reduces the risk but does not make the pattern equal to a synchronous database commit.\u003c/p>\u003cp>Other problems follow from the delay. Anything reading the database directly, such as a report, sees old data. If the database is down or slow, unflushed writes accumulate in memory. Ordering between related records can also break when they are flushed separately.\u003c/p>\u003cp>Use this pattern for data you could afford to lose or recompute. Do not use it for payments, orders or anything else that a user has been promised is saved.\u003c/p>","avoid":"","usage":["Can we buffer the like counts in Redis and flush every few seconds?","Yes, write-behind is fine there. Losing a few likes in a crash is acceptable, unlike losing an order."],"out":[29,31,32,9]},{"name":"Cache invalidation","section":3,"description":"Removing or updating cached copies when the source data changes, so that readers stop receiving stale values.","body":"\u003cp>\u003ca href=\"#Cache\" data-term=\"Cache\">Cache\u003c/a> invalidation is the removal or updating of cached copies when the source data changes. A cache does not know that a database row has been modified, so something must tell it, or the copy must expire. Until that happens, readers get stale data. A customer changes their shipping address, sees the old one on the checkout page, and contacts support.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Strategy\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#TTL\" data-term=\"TTL\">TTL\u003c/a> expiry\u003c/td>\u003ctd>Copy expires after a set time\u003c/td>\u003ctd>Simple, but stale until it expires\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Delete on write\u003c/td>\u003ctd>Writer removes the key after updating\u003c/td>\u003ctd>Must find every affected key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Versioned keys\u003c/td>\u003ctd>Key includes a version, such as \u003ccode>user:42:v7\u003c/code>\u003c/td>\u003ctd>Old entries linger until evicted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Change events\u003c/td>\u003ctd>Database changes are streamed to a consumer that deletes keys\u003c/td>\u003ctd>Accurate, more infrastructure\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Finding every affected key is often the difficult part. A product's price may appear in the product entry, a category listing, search results and a cached homepage. Deleting the first and forgetting the rest gives pages that disagree with each other.\u003c/p>\u003cp>Timing is the other difficulty. Between a database commit and the delete, readers can still get the old value, and a slow reader can write an old value back after the delete, as in the race described under \u003ca href=\"#Cache-aside\" data-term=\"Cache-aside\">cache-aside\u003c/a>. Several layers add to it, because clearing Redis does nothing for a copy in a \u003ca href=\"#CDN\" data-term=\"CDN\">CDN\u003c/a> or a browser.\u003c/p>\u003cp>The usual practice combines methods: delete the key on write for prompt updates, and set a TTL so that any missed invalidation corrects itself. Decide how much staleness each kind of data can tolerate. A follower count can lag by minutes, while a permission change should take effect quickly and may be better left uncached.\u003c/p>","avoid":"","usage":["We removed her admin role, but she can still open the settings page.","Permissions are cached per session and nothing handles invalidation on role change. Delete that key when the role is updated."],"out":[29,35,31,24]},{"name":"TTL","section":3,"description":"Time to live, a duration after which a stored item such as a cache entry or DNS record is treated as expired.","body":"\u003cp>TTL stands for time to live, a duration after which a stored item is treated as expired. A \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> entry with a TTL of 300 seconds is served for five minutes, and after that the next request must fetch a fresh copy. DNS records carry a TTL too, and so do many session stores and message systems. In IP networking the same name refers to a hop limit on a packet, which is a separate concept.\u003c/p>\u003cp>Setting a TTL is a trade between freshness and load:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>TTL\u003c/th>\u003cth>Staleness\u003c/th>\u003cth>Load on the source\u003c/th>\u003cth>Typical use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Seconds\u003c/td>\u003ctd>Very little\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Stock levels, live scores\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Minutes\u003c/td>\u003ctd>Small\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>Product pages, feeds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hours\u003c/td>\u003ctd>Noticeable\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>Reference data, config\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Days+\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Very low\u003c/td>\u003ctd>Versioned, unchanging files\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A TTL also acts as a safety net for \u003ca href=\"#Cache%20invalidation\" data-term=\"Cache invalidation\">cache invalidation\u003c/a>. If a delete is missed, the wrong value still disappears when it expires. For that reason, entries with no TTL are risky, because a single stale value can stay indefinitely.\u003c/p>\u003cp>Identical TTLs cause a recognisable problem. If a job loads 100,000 keys at once with a one-hour TTL, they all expire together, and the database gets a load spike every hour on the hour. Adding jitter, a small random variation such as 3,600 seconds plus or minus 10%, spreads the expiries out. For a single popular key, expiry can trigger a \u003ca href=\"#Cache%20stampede\" data-term=\"Cache stampede\">cache stampede\u003c/a>.\u003c/p>\u003cp>DNS TTLs catch people during migrations. If a record has a 24-hour TTL and you change the IP, some clients keep using the old address for up to a day. Lower the TTL at least one full old-TTL period before the change, then raise it again afterwards.\u003c/p>","avoid":"","usage":["We cut over the DNS an hour ago and half the traffic still hits the old \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a>.","The record had a TTL of a day. We should have lowered it yesterday."],"out":[29,34,37,19]},{"name":"Eviction policy","section":3,"description":"The rule a cache uses to choose which entries to remove when it runs out of memory.","body":"\u003cp>An eviction policy is the rule a \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> uses to choose which entries to remove when it runs out of memory. Eviction differs from expiry. A \u003ca href=\"#TTL\" data-term=\"TTL\">TTL\u003c/a> removes data because it is old, while eviction removes data because space is needed, even if that data is still valid.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Policy\u003c/th>\u003cth>Removes\u003c/th>\u003cth>Works well when\u003c/th>\u003cth>Weakness\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>LRU\u003c/td>\u003ctd>Least recently used entry\u003c/td>\u003ctd>Recent items tend to be reused\u003c/td>\u003ctd>One large scan flushes useful data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LFU\u003c/td>\u003ctd>Least frequently used entry\u003c/td>\u003ctd>Popularity is stable\u003c/td>\u003ctd>Old favourites can linger\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FIFO\u003c/td>\u003ctd>Oldest inserted entry\u003c/td>\u003ctd>Items lose value with age\u003c/td>\u003ctd>Ignores how often items are used\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Random\u003c/td>\u003ctd>Any entry\u003c/td>\u003ctd>Access is fairly uniform\u003c/td>\u003ctd>May remove popular items\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TTL-based\u003c/td>\u003ctd>Entry closest to expiry\u003c/td>\u003ctd>TTLs reflect value\u003c/td>\u003ctd>Depends on sensible TTLs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No eviction\u003c/td>\u003ctd>Nothing, new writes fail\u003c/td>\u003ctd>Data must not be silently dropped\u003c/td>\u003ctd>Errors once memory is full\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>LRU's known weakness is scan pollution. A nightly export reads millions of rows once, each read counts as recent, and the entries people actually use are pushed out. The next morning the \u003ca href=\"#Cache%20hit%20ratio\" data-term=\"Cache hit ratio\">cache hit ratio\u003c/a> is low and the database is busy until the cache refills. Fixes include having batch jobs bypass the cache, or using a scan-resistant policy such as an LFU variant.\u003c/p>\u003cp>Check the configured policy, because the failure mode depends on it. Redis's \u003ccode>noeviction\u003c/code> policy returns errors on writes once memory is full, which an application may experience as a sudden outage of the cache. If a store holds data with no other copy, such as a job queue, an evicting policy can delete it silently.\u003c/p>\u003cp>A rising eviction count alongside a falling hit ratio usually means the cache is too small for its working set.\u003c/p>","avoid":"","usage":["Hit ratio tanks every morning around 3 a.m. and recovers by nine.","That's the export job. Our LRU eviction policy treats every row it scans as recent, so make it skip the cache."],"out":[29,35,30]},{"name":"Cache stampede","section":3,"description":"Many concurrent requests missing the same cache entry at once and all hitting the database to rebuild it.","body":"\u003cp>A \u003ca href=\"#Cache\" data-term=\"Cache\">cache\u003c/a> stampede happens when many concurrent requests miss the same entry and all go to the database to rebuild it. It is also called a thundering herd or dogpile. It usually starts when a popular key expires or the cache restarts empty.\u003c/p>\u003cp>The sequence feeds itself:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>A \u003ca href=\"#Hot%20key\" data-term=\"Hot key\">hot key\u003c/a> expires\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Hundreds of in-flight requests see a miss before anyone refills it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Each one runs the same expensive query\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>The database slows under the duplicated work\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Queries take longer, so the key stays empty and more requests pile in\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Requests hit their \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeouts\u003c/a>, and any retries add load\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The recognisable symptom is a database spike that recurs at regular intervals and matches a key's \u003ca href=\"#TTL\" data-term=\"TTL\">TTL\u003c/a>, or an outage that begins moments after a cache restart. If the query takes 2 seconds and the key receives 1,000 requests per second, about 2,000 identical queries can start before the first one finishes.\u003c/p>\u003cp>Several defences exist, and they combine well:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technique\u003c/th>\u003cth>How it works\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Request coalescing\u003c/td>\u003ctd>One request per key does the rebuild, and others await its result\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lock or lease\u003c/td>\u003ctd>Only the holder rebuilds, and the rest wait or get stale data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stale-while-revalidate\u003c/td>\u003ctd>Serve the expired value while one worker refreshes it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Early refresh\u003c/td>\u003ctd>Refresh popular keys shortly before they expire\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TTL jitter\u003c/td>\u003ctd>Randomise expiry so that keys do not expire together\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warming\u003c/td>\u003ctd>Load popular keys before sending traffic to a new cache\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Coalescing inside each process, such as Go's \u003ccode>singleflight\u003c/code>, limits duplicates to one per server, and a distributed lock can limit them across the fleet. Give any lock its own expiry, so that a crashed holder cannot block the key forever.\u003c/p>","avoid":"","usage":["The database falls over at the same minute every hour.","That's a cache stampede on the homepage query. Add request coalescing and jitter the TTL."],"out":[29,18,45,35]},{"name":"Message queue","section":4,"description":"A buffer that holds messages from producers until a consumer processes them, so the two do not need to run in step.","body":"\u003cp>A message queue is a buffer that holds messages from producers until a consumer processes them. The producer adds a task and moves on, without waiting for the work to finish. A checkout service can queue &quot;send receipt&quot; and respond to the customer at once, even if the email provider is slow or briefly down.\u003c/p>\u003cp>Each message is normally handled by one consumer, and several consumers can share a queue to work through it faster:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Producer\u003c/td>\u003ctd>Sends a message to the broker, the server that runs the queue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Broker\u003c/td>\u003ctd>Stores it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Consumer\u003c/td>\u003ctd>Receives it, and the broker hides it from other consumers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Consumer\u003c/td>\u003ctd>Does the work\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Consumer\u003c/td>\u003ctd>Acknowledges it, and the broker removes it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Broker\u003c/td>\u003ctd>Redelivers it if no acknowledgement arrives in time\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Step 6 means most queues provide at-least-once delivery, so a message can arrive twice. If a consumer finishes sending an email and crashes before acknowledging, another consumer sends it again, and the customer receives two receipts. Consumers should be idempotent, meaning that processing a message twice has the same effect as processing it once. A common method is to record each message ID and skip those already handled.\u003c/p>\u003cp>A job that runs longer than the redelivery window causes the same duplication, because the broker assumes the consumer died. Extend the window for long jobs.\u003c/p>\u003cp>Queue depth is the number to watch. A depth that keeps growing means producers are outrunning consumers, and users see work delayed by minutes or hours while every service reports healthy. Add consumers, or apply \u003ca href=\"#Backpressure\" data-term=\"Backpressure\">backpressure\u003c/a>. Messages that fail repeatedly belong in a \u003ca href=\"#Dead%20letter%20queue\" data-term=\"Dead letter queue\">dead letter queue\u003c/a>.\u003c/p>\u003cp>RabbitMQ and Amazon SQS are examples. To deliver one message to several independent consumers, use \u003ca href=\"#Publish-subscribe\" data-term=\"Publish-subscribe\">publish-subscribe\u003c/a>.\u003c/p>","avoid":"","usage":["Customers are getting their invoice PDF two or three times.","The job takes longer than the message queue's visibility \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeout\u003c/a>, so it gets redelivered while still running."],"out":[42,43,39,45]},{"name":"Publish-subscribe","section":4,"description":"A messaging pattern where publishers send to a named topic and every subscriber to that topic receives its own copy.","body":"\u003cp>Publish-subscribe, or pub/sub, is a messaging pattern in which publishers send messages to a named topic and every subscriber to that topic receives its own copy. The publisher does not know who is listening. When an order is placed, the order service publishes one \u003ccode>order.placed\u003c/code> message, and the email, analytics and warehouse services each receive it.\u003c/p>\u003cp>The difference from a \u003ca href=\"#Message%20queue\" data-term=\"Message queue\">message queue\u003c/a> is who gets each message:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>Message queue\u003c/th>\u003cth>Publish-subscribe\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Delivery\u003c/td>\u003ctd>One consumer per message\u003c/td>\u003ctd>Every subscriber gets a copy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Purpose\u003c/td>\u003ctd>Share out work\u003c/td>\u003ctd>Broadcast that something happened\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Adding a consumer\u003c/td>\u003ctd>Splits the existing work\u003c/td>\u003ctd>Adds another independent copy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typical message\u003c/td>\u003ctd>&quot;Resize this image&quot;\u003c/td>\u003ctd>&quot;An image was uploaded&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The main benefit is decoupling. A new service can react to orders by subscribing, with no change to the order service. This makes pub/sub a common building block of \u003ca href=\"#Event-driven%20architecture\" data-term=\"Event-driven architecture\">event-driven architecture\u003c/a>. The two patterns are often combined, with each subscriber having its own queue so that it can process its copy at its own pace and retry on failure.\u003c/p>\u003cp>Durability varies by product, and this catches people out. With Redis Pub/Sub, a subscriber that is disconnected when a message is published misses it permanently. A service restarts during a deploy, and the orders published in those seconds never reach it, with no error anywhere. Systems such as Google Cloud Pub/Sub retain messages for each subscription until they are acknowledged or a retention period ends. If missing a message matters, choose a durable option.\u003c/p>\u003cp>Decoupling also hides dependencies. A publisher can change a field in its message and break a consumer its team did not know existed. Keep a record of who subscribes to what, and treat message formats as a public contract.\u003c/p>","avoid":"","usage":["Finance wants a copy of every refund. Do we need to change the payments service?","No. It already publishes refund events, so with publish-subscribe they add a subscription."],"out":[38,56]},{"name":"Event streaming","section":4,"description":"Recording events in a durable, ordered log that many consumers can read independently and replay from any position.","body":"\u003cp>Event streaming records events in a durable, append-only log that many consumers read independently. Unlike a \u003ca href=\"#Message%20queue\" data-term=\"Message queue\">message queue\u003c/a>, reading an event does not remove it. Each consumer tracks its own position in the log, called an offset, and events stay until a retention limit is reached. Apache Kafka and Amazon Kinesis are examples.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>Message queue\u003c/th>\u003cth>Event stream\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>After reading\u003c/td>\u003ctd>Message is removed\u003c/td>\u003ctd>Event stays in the log\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consumer state\u003c/td>\u003ctd>Broker tracks each message\u003c/td>\u003ctd>Consumer tracks an offset\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Replay\u003c/td>\u003ctd>Generally not possible\u003c/td>\u003ctd>Rewind the offset and read again\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ordering\u003c/td>\u003ctd>Often loose\u003c/td>\u003ctd>Guaranteed within a partition\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typical use\u003c/td>\u003ctd>Task distribution\u003c/td>\u003ctd>Data pipelines, activity feeds, audit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Replay is the main practical benefit. If a bug corrupts a derived table, you can fix the code, reset the offset and rebuild the table from history.\u003c/p>\u003cp>A stream is split into partitions so it can scale, and a partition key decides where each event goes. Order is only guaranteed inside a partition. If events for one order are keyed randomly, &quot;order shipped&quot; can be processed before &quot;order paid&quot;, which produces failures that are hard to reproduce. Key by the entity whose order matters, such as the order ID. Avoid low-variety keys, which concentrate traffic in the same way as a \u003ca href=\"#Hot%20key\" data-term=\"Hot key\">hot key\u003c/a>.\u003c/p>\u003cp>Consumers share partitions through a \u003ca href=\"#Consumer%20group\" data-term=\"Consumer group\">consumer group\u003c/a>. The health metric is consumer lag, the distance between the newest event and a consumer's offset. Growing lag means the consumer is falling behind and downstream data is getting older.\u003c/p>\u003cp>Retention sets a hard limit. If a consumer is down for longer than the retention period, the events it missed are deleted before it can read them. Delivery is typically at-least-once, so consumers must tolerate duplicates.\u003c/p>","avoid":"","usage":["We shipped a bug that miscalculated revenue for the last three days.","Event streaming saves us here. Fix the consumer, reset its offset to Monday and rebuild the table."],"out":[38,18,41]},{"name":"Consumer group","section":4,"description":"A set of consumers that share the work of reading a stream, with each partition assigned to one member at a time.","body":"\u003cp>A consumer group is a set of consumers that share the work of reading a stream, with each partition assigned to one member at a time. The term comes from \u003ca href=\"#Event%20streaming\" data-term=\"Event streaming\">event streaming\u003c/a> systems such as Apache Kafka. Separate groups each read the full stream independently, so a billing group and an analytics group can consume the same topic at different speeds.\u003c/p>\u003cp>Because a partition has only one active reader per group, the partition count sets the upper limit on parallelism. With 6 partitions:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Consumers in group\u003c/th>\u003cth>Assignment\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>One consumer reads all 6\u003c/td>\u003ctd>No parallelism\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>3 each\u003c/td>\u003ctd>Twice the capacity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>1 each\u003c/td>\u003ctd>Maximum parallelism\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>6 active, 2 idle\u003c/td>\u003ctd>Extra consumers do nothing\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last row is a common surprise. A team sees lag growing, scales from 6 pods to 12, and nothing improves because half of them hold no partitions. The fix is more partitions, which can change how keys map to partitions and therefore affects ordering, or faster processing per message.\u003c/p>\u003cp>When members join or leave, the group performs a rebalance, moving partitions between consumers. During a rebalance, some or all consumption may pause. A consumer that takes too long between polls is presumed dead and removed from the group. Its partitions move to another member, which reprocesses the same slow batch and may also time out, producing a loop of rebalances with little progress. In Kafka this is governed by \u003ccode>max.poll.interval.ms\u003c/code>. Reduce batch size or move slow work elsewhere.\u003c/p>\u003cp>Each group commits offsets to record its progress. A consumer that crashes after processing but before committing causes those events to be processed again, so handlers need to be idempotent, meaning safe to run twice.\u003c/p>","avoid":"","usage":["Lag keeps climbing, so I doubled the consumers, and half of them are idle.","The topic has 12 partitions, and the consumer group already had 12 members before you doubled it. We need more partitions."],"out":[40]},{"name":"Backpressure","section":4,"description":"A way for a slower part of a system to make faster upstream parts slow down, so that work does not pile up without limit.","body":"\u003cp>Backpressure is a way for a slower part of a system to make faster upstream parts reduce their sending rate. Without it, work piles up wherever the producer outruns the consumer, usually in an in-memory buffer. That buffer grows until the process runs out of memory and crashes, losing everything it held.\u003c/p>\u003cp>The recognisable symptom is memory that climbs steadily during a traffic peak, followed by a crash, with \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a> rising the whole time because each new item waits behind a longer backlog. A queue with no size limit hides overload until it fails.\u003c/p>\u003cp>When a bounded buffer fills up, a component has a limited set of choices:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Response\u003c/th>\u003cth>What happens\u003c/th>\u003cth>Suitable when\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Block\u003c/td>\u003ctd>Producer waits until there is room\u003c/td>\u003ctd>Producer can safely pause\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reject\u003c/td>\u003ctd>Return an error such as 429 or 503\u003c/td>\u003ctd>Caller can retry or give up\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Drop\u003c/td>\u003ctd>Discard new or old items\u003c/td>\u003ctd>Losing some data is fine, as in metrics\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sample\u003c/td>\u003ctd>Keep a fraction of items\u003c/td>\u003ctd>Approximate data is acceptable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scale consumers\u003c/td>\u003ctd>Add capacity\u003c/td>\u003ctd>Slowdown is sustained, not a spike\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Strictly, only blocking and rejecting push back on the sender. Dropping and sampling protect the system without slowing the producer. All of them depend on the buffer having a limit.\u003c/p>\u003cp>TCP has backpressure built in. A receiver advertises how much data it can accept, and the sender slows when that window shrinks.\u003c/p>\u003cp>The signal has to travel all the way to the source. If a worker slows but its API keeps accepting requests into an unbounded \u003ca href=\"#Message%20queue\" data-term=\"Message queue\">message queue\u003c/a>, the problem has moved without being solved. At the system edge, the final form of backpressure is telling clients to wait, through \u003ca href=\"#Rate%20limiting\" data-term=\"Rate limiting\">rate limiting\u003c/a> or \u003ca href=\"#Load%20shedding\" data-term=\"Load shedding\">load shedding\u003c/a>.\u003c/p>","avoid":"","usage":["The ingest service gets OOM-killed every time a big customer uploads.","It buffers without a limit. Bound the queue and add backpressure so uploads wait when the writer falls behind."],"out":[3,38,26,51]},{"name":"Dead letter queue","section":4,"description":"A holding queue for messages that failed processing too many times, so they stop blocking other work and can be inspected.","body":"\u003cp>A dead letter queue is a holding queue for messages that could not be processed after a set number of attempts. It removes the failing message from the main flow while keeping it for inspection.\u003c/p>\u003cp>The usual reason for needing one is a poison message: a message that always fails, such as one with a malformed field or a reference to a deleted record. In a \u003ca href=\"#Message%20queue\" data-term=\"Message queue\">message queue\u003c/a> with automatic redelivery, the consumer picks it up, crashes, restarts and picks it up again. Logs fill with one repeated stack trace, and in an ordered system the messages behind it stop moving.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Consumer\u003c/td>\u003ctd>Fails to process a message\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Broker\u003c/td>\u003ctd>Redelivers it and counts the attempt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Broker\u003c/td>\u003ctd>Moves it to the dead letter queue once the limit is reached\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Alerting\u003c/td>\u003ctd>Notifies the team that the queue is no longer empty\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Engineer\u003c/td>\u003ctd>Finds the cause and fixes the code or the data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Engineer\u003c/td>\u003ctd>Redrives the message to the main queue, or discards it\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An attempt limit that is too low sends thousands of good messages to the dead letter queue during a brief dependency outage. A consumer that recognises a permanent error, such as a validation failure, can send the message there at once, without further \u003ca href=\"#Retry%20with%20backoff\" data-term=\"Retry with backoff\">retries\u003c/a>.\u003c/p>\u003cp>The common mistake is creating one and never watching it. Messages accumulate unnoticed until retention deletes them. Alert on its depth, and store the error reason and original metadata with each message.\u003c/p>\u003cp>Check ordering before redriving, because a replayed old update can overwrite newer data. Amazon SQS and RabbitMQ support this pattern directly. With Apache Kafka it is usually implemented in the consumer or its framework.\u003c/p>","avoid":"","usage":["The worker has been crash-looping on the same order for an hour.","That's a poison message. Set a max receive count so it lands in the dead letter queue and the rest can flow."],"out":[38,46]},{"name":"Outbox pattern","section":4,"description":"Saving an outgoing event in the same database transaction as the data change, then publishing it from there afterwards.","body":"\u003cp>The outbox pattern saves an outgoing event in the same database transaction as the data change, then publishes it to a message broker afterwards. It solves the dual-write problem, which arises when a service must update its database and also send a message, since those are two systems with no shared transaction.\u003c/p>\u003cp>Doing the two writes in sequence leaves a gap whichever order you choose. If the service commits the order and crashes before publishing, the order exists, but the warehouse never hears about it. If it publishes first and the commit then fails, the warehouse ships an order that does not exist. These bugs surface as a few records that get stuck with no error logged.\u003c/p>\u003cp>With an outbox, one database transaction covers both writes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Service\u003c/td>\u003ctd>Begins a database transaction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Service\u003c/td>\u003ctd>Writes the business change, such as a new order row\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Service\u003c/td>\u003ctd>Inserts the event into an \u003ccode>outbox\u003c/code> table\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Service\u003c/td>\u003ctd>Commits, so both are saved or neither is\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Relay\u003c/td>\u003ctd>Reads unpublished rows and sends them to the broker\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Relay\u003c/td>\u003ctd>Marks them as published once the broker confirms\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The relay either polls the table or uses change data capture, which reads the database's transaction log. Debezium is a common tool for the second approach.\u003c/p>\u003cp>The relay can crash between steps 5 and 6 and send the event again, so delivery is at-least-once. Consumers must therefore be idempotent, meaning a duplicate has no additional effect.\u003c/p>\u003cp>Delete or archive published rows, or the table grows without limit. Keep events for one entity in order if several relay workers run. It is often used to drive a \u003ca href=\"#Saga\" data-term=\"Saga\">saga\u003c/a> or feed \u003ca href=\"#Event-driven%20architecture\" data-term=\"Event-driven architecture\">event-driven architecture\u003c/a>.\u003c/p>","avoid":"","usage":["A few orders each week never reach the warehouse, and there's no error.","We commit and then publish, so a crash in between loses the event. Use the outbox pattern."],"out":[59,56]},{"name":"Timeout","section":5,"description":"A limit on how long a caller waits for an operation before giving up and treating it as failed.","body":"\u003cp>A timeout is a limit on how long a caller waits for an operation before giving up and treating it as failed. Without one, a call to a stalled dependency can wait indefinitely, holding a thread and a connection. Some libraries, such as Python's \u003ccode>requests\u003c/code>, wait indefinitely unless you pass a timeout.\u003c/p>\u003cp>The missing timeout has a recognisable symptom. A service hangs with low CPU and no errors in its logs, because every worker is parked waiting on a slow downstream call. One stalled dependency can then produce a \u003ca href=\"#Cascading%20failure\" data-term=\"Cascading failure\">cascading failure\u003c/a> through everything that calls this service.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Kind\u003c/th>\u003cth>What it limits\u003c/th>\u003cth>Typical size\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Connect\u003c/td>\u003ctd>Establishing the connection\u003c/td>\u003ctd>Short, often around a second\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read\u003c/td>\u003ctd>Waiting between bytes of the response\u003c/td>\u003ctd>Based on the dependency's p99\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Overall request\u003c/td>\u003ctd>The whole call from start to finish\u003c/td>\u003ctd>Slightly above the read timeout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deadline\u003c/td>\u003ctd>A budget shared by every hop in a request chain\u003c/td>\u003ctd>Set once at the entry point\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A read timeout alone misses a server that sends one byte every few seconds, so set an overall limit too.\u003c/p>\u003cp>To choose a value, measure the dependency's p99 \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a> and add a margin. Too short, and healthy requests fail during small slowdowns. Too long, and the protection arrives after your threads are exhausted.\u003c/p>\u003cp>Timeouts must fit together across layers. If a gateway gives up after 5 seconds while its backend keeps working for 30, the backend spends capacity on an answer nobody will read. Pass a deadline with the request, so that each service knows how much time remains.\u003c/p>\u003cp>A timeout does not mean the operation failed. The server may have finished the payment after the client stopped waiting. Before using \u003ca href=\"#Retry%20with%20backoff\" data-term=\"Retry with backoff\">retry with backoff\u003c/a>, make sure repeating the operation is safe.\u003c/p>","avoid":"","usage":["The checkout pods are all stuck, but CPU is at 3% and nothing's logged.","The fraud API is hanging and that client has no timeout, so every worker is waiting on it."],"out":[52,3,46]},{"name":"Retry with backoff","section":5,"description":"Repeating a failed call after a wait that grows with each attempt, usually with added randomness to spread clients out.","body":"\u003cp>Retry with backoff means repeating a failed call after a wait that grows with each attempt. Many failures are transient, such as a dropped connection or an instance restarting, and a second attempt moments later succeeds. Waiting longer each time gives a struggling service room to recover.\u003c/p>\u003cp>The usual form is exponential backoff with jitter. Jitter is added randomness, and it matters because clients that failed together would otherwise retry together in synchronised waves. With &quot;full jitter&quot;, each wait is a random value between zero and a growing ceiling. With a base of 100 ms and a cap of 2 seconds:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Retry\u003c/th>\u003cth>Ceiling (doubles, capped)\u003c/th>\u003cth>Actual wait\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>100 ms\u003c/td>\u003ctd>Random, 0–100 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>200 ms\u003c/td>\u003ctd>Random, 0–200 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>400 ms\u003c/td>\u003ctd>Random, 0–400 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>800 ms\u003c/td>\u003ctd>Random, 0–800 ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>1,600 ms\u003c/td>\u003ctd>Random, 0–1.6 s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>2,000 ms (cap)\u003c/td>\u003ctd>Random, 0–2 s\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Retry only what can succeed on a second attempt. Connection errors, \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeouts\u003c/a>, 429 and 503 are reasonable candidates. A 400 or 403 will usually fail the same way, although some APIs also use 403 for \u003ca href=\"#Rate%20limiting\" data-term=\"Rate limiting\">rate limits\u003c/a>. If the server sends a \u003ccode>Retry-After\u003c/code> header, honour it.\u003c/p>\u003cp>Safety is the other condition. If a payment request times out, the charge may have gone through, and a blind retry charges the customer twice. Retry only idempotent operations, those where repeating has no additional effect. For others, send an idempotency key, a unique ID the server uses to recognise a repeated request.\u003c/p>\u003cp>Always limit the attempts and the total time, and keep that total inside the caller's own deadline. Retrying at several layers multiplies load and can cause a \u003ca href=\"#Retry%20storm\" data-term=\"Retry storm\">retry storm\u003c/a>. A \u003ca href=\"#Circuit%20breaker\" data-term=\"Circuit breaker\">circuit breaker\u003c/a> stops retries when a dependency is down.\u003c/p>","avoid":"","usage":["The sync job fails whenever the vendor API has a brief 503.","Wrap it in retry with backoff and jitter, five attempts at most, and honour their \u003ccode>Retry-After\u003c/code>."],"out":[45,26,47,48]},{"name":"Retry storm","section":5,"description":"A surge of repeated requests from clients retrying failures, adding load to a service that is already struggling.","body":"\u003cp>A retry storm is a surge of repeated requests from clients retrying failures, which adds load to a service that is already struggling. When a service is overloaded, most requests fail, every failure generates more requests, and the extra traffic keeps the service overloaded.\u003c/p>\u003cp>The recognisable symptom is a dependency that cannot recover. Requests to it are several times higher than real user traffic, it comes back for a moment after a restart, and it is knocked over again within seconds. The original cause may be long gone, while the retries alone sustain the outage.\u003c/p>\u003cp>Retries at several layers multiply. If each layer makes up to 3 attempts, the bottom of the call chain receives:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Layers that retry\u003c/th>\u003cth>Maximum attempts per user request\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>27\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>81\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003ca href=\"#Retry%20with%20backoff\" data-term=\"Retry with backoff\">Retry with backoff\u003c/a> spreads attempts over time, but it does not reduce how many are made, so it is necessary and not sufficient.\u003c/p>\u003cp>Several controls limit the amplification:\u003c/p>\u003cul>\u003cli>\u003cstrong>Retry at one layer.\u003c/strong> Usually the layer closest to the failing call. Others pass the error up.\u003c/li>\u003cli>\u003cstrong>Retry budgets.\u003c/strong> Allow retries only up to a fixed share of normal traffic, such as 10%, per client.\u003c/li>\u003cli>\u003cstrong>\u003ca href=\"#Circuit%20breaker\" data-term=\"Circuit breaker\">Circuit breakers\u003c/a>.\u003c/strong> Stop calling a dependency that is failing.\u003c/li>\u003cli>\u003cstrong>Explicit overload signals.\u003c/strong> Have the server mark an error as &quot;do not retry&quot;, and have callers obey it.\u003c/li>\u003cli>\u003cstrong>\u003ca href=\"#Load%20shedding\" data-term=\"Load shedding\">Load shedding\u003c/a>.\u003c/strong> Reject excess work inexpensively, so that the server survives the surge.\u003c/li>\u003c/ul>\u003cp>During an incident, the quickest way out is often to cut incoming traffic at the edge and restore it gradually, since the service may be unable to recover while the backlog of retries continues. A retry storm is a common way for a small fault to become a \u003ca href=\"#Cascading%20failure\" data-term=\"Cascading failure\">cascading failure\u003c/a>.\u003c/p>","avoid":"","usage":["Auth came back up, then fell over again thirty seconds later.","That's a retry storm. Three layers each make three attempts, so it can see up to 27 times the real load."],"out":[46,48,51,52]},{"name":"Circuit breaker","section":5,"description":"A wrapper that stops calling a failing dependency for a while and returns an immediate error so the caller stays healthy.","body":"\u003cp>A circuit breaker is a wrapper around calls to a dependency that stops sending requests once the failure rate gets too high. Callers then receive an immediate error instead of waiting. The name comes from the electrical device that cuts a circuit to prevent damage.\u003c/p>\u003cp>The problem it addresses is slow failure. When a dependency hangs, each call holds a thread until its \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeout\u003c/a> expires, so a service with healthy code runs out of workers waiting on something that will not answer. Failing in a millisecond keeps those workers free for other requests and gives the dependency room to recover.\u003c/p>\u003cp>A breaker moves between three states:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>State\u003c/th>\u003cth>Behaviour\u003c/th>\u003cth>Moves to\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Closed\u003c/td>\u003ctd>Calls pass through, and failures are counted\u003c/td>\u003ctd>Open, when failures cross a threshold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open\u003c/td>\u003ctd>Calls fail immediately\u003c/td>\u003ctd>Half-open, after a cool-down period\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Half-open\u003c/td>\u003ctd>A few trial calls are allowed\u003c/td>\u003ctd>Closed if they succeed, open if they fail\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Thresholds are normally a failure percentage over a sliding period with a minimum number of calls, so that two failures out of three at a quiet moment do not trip it. Count slow calls as well as errors, since slowness is often how a failure begins. Client errors such as 400 should not count, because they say nothing about the dependency's health.\u003c/p>\u003cp>What the caller does while the breaker is open is a product decision. Options include a cached value, a default, or a reduced page, which is \u003ca href=\"#Graceful%20degradation\" data-term=\"Graceful degradation\">graceful degradation\u003c/a>. If there is no fallback, return a clear error.\u003c/p>\u003cp>Use one breaker per dependency, and sometimes per endpoint, so that one bad route does not block a healthy one. Breakers also limit a \u003ca href=\"#Retry%20storm\" data-term=\"Retry storm\">retry storm\u003c/a>, because retries against an open breaker fail locally. Resilience4j is an example library.\u003c/p>","avoid":"","usage":["Recommendations is down and it's dragging the product page with it.","Put a circuit breaker on that call and render the page without the widget while it's open."],"out":[45,50,47]},{"name":"Bulkhead","section":5,"description":"Isolating resources into separate pools so that a failure or overload in one part cannot consume capacity for the rest.","body":"\u003cp>A bulkhead is an isolation technique that divides resources into separate pools, so that a failure or overload in one part cannot use up capacity needed by the rest. The name comes from the watertight compartments in a ship's hull, which keep a breach from flooding the whole vessel.\u003c/p>\u003cp>The problem it solves is a shared pool. Suppose a service has 200 worker threads and calls three dependencies. One dependency becomes slow, its calls start holding threads, and soon all 200 are waiting on it. Requests that have nothing to do with the slow dependency now fail too. Users find login broken because the PDF report service is slow, and the two features appear unrelated.\u003c/p>\u003cp>With a bulkhead, the slow dependency can only exhaust its own allocation:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Pool\u003c/th>\u003cth>Threads\u003c/th>\u003cth>When reports hang\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Login\u003c/td>\u003ctd>80\u003c/td>\u003ctd>Unaffected\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Search\u003c/td>\u003ctd>80\u003c/td>\u003ctd>Unaffected\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reports\u003c/td>\u003ctd>40\u003c/td>\u003ctd>Full, and extra requests are rejected\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Isolation can be applied at several levels:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Concurrency\u003c/td>\u003ctd>A semaphore capping in-flight calls to one dependency\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thread pool\u003c/td>\u003ctd>A separate pool for each downstream service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Connection pool\u003c/td>\u003ctd>Separate database pools for web traffic and batch jobs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Instance\u003c/td>\u003ctd>Dedicated servers for admin or reporting endpoints\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tenant\u003c/td>\u003ctd>A separate cluster for a very large customer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Infrastructure\u003c/td>\u003ctd>Separate availability zones (isolated sites)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The trade-off is reduced efficiency. Capacity reserved for one pool sits idle while another is full, so sizes must be chosen from measured load and reviewed as traffic changes. Too small a pool rejects healthy requests during a normal peak.\u003c/p>\u003cp>Bulkheads work alongside other controls. A \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeout\u003c/a> frees a held resource, a \u003ca href=\"#Circuit%20breaker\" data-term=\"Circuit breaker\">circuit breaker\u003c/a> stops new calls to a failing dependency, and the bulkhead limits how much damage occurs before either acts. Together they help contain a \u003ca href=\"#Cascading%20failure\" data-term=\"Cascading failure\">cascading failure\u003c/a>.\u003c/p>","avoid":"","usage":["A slow export took down the whole admin API again.","They share one connection pool. Add a bulkhead so exports get their own small pool."],"out":[45,48,52]},{"name":"Graceful degradation","section":5,"description":"Keeping the main functions of a system working with reduced features when a part of it fails or is overloaded.","body":"\u003cp>Graceful degradation means keeping the main functions of a system working, with reduced features, when part of it fails or is overloaded. The alternative is all-or-nothing behaviour, where one optional component takes the whole page down. A product page that returns a 500 because the recommendations widget timed out is a typical example. The customer could have bought the item without seeing recommendations.\u003c/p>\u003cp>Designing for it starts with sorting features by how much they matter, then deciding what each one does when its dependency is unavailable:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Feature\u003c/th>\u003cth>Normal\u003c/th>\u003cth>Degraded\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Recommendations\u003c/td>\u003ctd>Personalised\u003c/td>\u003ctd>Generic bestseller list, or hidden\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Search\u003c/td>\u003ctd>Full ranking\u003c/td>\u003ctd>Simpler ranking, fewer results\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reviews\u003c/td>\u003ctd>Live data\u003c/td>\u003ctd>\u003ca href=\"#Cache\" data-term=\"Cache\">Cache\u003c/a> copy, or hidden\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Video\u003c/td>\u0
