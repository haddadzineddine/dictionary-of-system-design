03ctd>High quality\u003c/td>\u003ctd>Lower bitrate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shipping estimate\u003c/td>\u003ctd>Exact date\u003c/td>\u003ctd>&quot;Usually ships in 3–5 days&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Checkout\u003c/td>\u003ctd>Full flow\u003c/td>\u003ctd>Stays on, other features give way\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The mechanics are usually simple. Give each optional call a short \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeout\u003c/a>, wrap it in a \u003ca href=\"#Circuit%20breaker\" data-term=\"Circuit breaker\">circuit breaker\u003c/a>, and write a fallback. Feature flags let operators turn off expensive features by hand during an incident, which pairs well with \u003ca href=\"#Load%20shedding\" data-term=\"Load shedding\">load shedding\u003c/a>.\u003c/p>\u003cp>Not everything should degrade. A fallback that quietly shows an old account balance or a stale stock count can cause more harm than an error. For payments, permissions and other data that must be correct, return an error. Tell the user when something is reduced if it affects their decisions.\u003c/p>\u003cp>Fallback paths need testing. Code that runs only during outages is often broken when it is finally needed, and a fallback that calls the same failing database gives no protection at all. Inject failures in a test environment to verify each one. Record when a fallback is active as well, because a degraded mode that nobody can see can run unnoticed for weeks.\u003c/p>","avoid":"","usage":["The reviews service is down. Do we need to pull the product page?","No, it has graceful degradation. The page renders from cache and hides the review section."],"out":[29,45,48,51]},{"name":"Load shedding","section":5,"description":"Deliberately rejecting some requests when a system is overloaded, so that it can keep serving the rest.","body":"\u003cp>Load shedding means deliberately rejecting some requests when a system is overloaded, so that it can keep serving the rest. The name comes from electricity grids, which cut power to some areas to protect the whole network.\u003c/p>\u003cp>It is needed because overloaded systems often do less useful work as load rises. Past capacity, requests queue and wait so long that clients give up, while the server keeps working on answers nobody will receive. CPU stays at 100% and \u003ca href=\"#Throughput\" data-term=\"Throughput\">throughput\u003c/a> of successful responses falls toward zero. Rejecting 20% of requests early can let the other 80% succeed, where accepting all of them might mean that almost none do.\u003c/p>\u003cp>The decision has to be inexpensive, so it happens as early as possible, before authentication, database calls or parsing a large body. Useful overload signals include the number of requests in flight and the time requests spend queued. These react faster and more directly than average CPU. Rejected requests typically get a 503, optionally with \u003ccode>Retry-After\u003c/code>.\u003c/p>\u003cp>Shedding works better when requests have priorities:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Priority\u003c/th>\u003cth>Example\u003c/th>\u003cth>Under overload\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Critical\u003c/td>\u003ctd>Checkout, login\u003c/td>\u003ctd>Shed last\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Normal\u003c/td>\u003ctd>Product pages, search\u003c/td>\u003ctd>Shed if needed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Low\u003c/td>\u003ctd>Recommendations, analytics\u003c/td>\u003ctd>Shed early\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Batch\u003c/td>\u003ctd>Exports, background sync\u003c/td>\u003ctd>Shed first\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Also drop requests whose deadline has already passed.\u003c/p>\u003cp>Load shedding differs from \u003ca href=\"#Rate%20limiting\" data-term=\"Rate limiting\">rate limiting\u003c/a>, which enforces per-client quotas regardless of server health. Shedding responds to the server's current state and can affect any client. It pairs with \u003ca href=\"#Graceful%20degradation\" data-term=\"Graceful degradation\">graceful degradation\u003c/a>, where the system does less for each request instead of refusing it.\u003c/p>\u003cp>Clients must cooperate. If every rejected request is retried immediately, shedding feeds a \u003ca href=\"#Retry%20storm\" data-term=\"Retry storm\">retry storm\u003c/a>. Test the behaviour with a load test beyond capacity, and confirm that successful throughput holds steady.\u003c/p>","avoid":"","usage":["At peak the API serves nothing, even though it's only 30% over capacity.","It's accepting everything and timing out. Add load shedding on queue time and drop the batch traffic first."],"out":[4,26,50,47]},{"name":"Cascading failure","section":5,"description":"A failure in one component that overloads or stalls others, spreading until a large part of the system is down.","body":"\u003cp>A cascading failure is a failure in one component that causes others to fail, spreading until a large part of the system is down. The initial fault is often small, such as one slow database query or one lost instance.\u003c/p>\u003cp>There are two common ways it spreads. One is load transfer: when a server fails, its traffic moves to the survivors, which then exceed their capacity and fail too. The other is resource exhaustion: a slow dependency holds its callers' threads and connections until those callers stop responding, and their own callers then stall in turn.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>A database slows down\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Service A's threads fill up waiting on it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Health checks on A time out, and instances are removed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Remaining A instances receive more traffic and fail\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Service B, which calls A, runs out of threads\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Clients and services retry, multiplying the load\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>The site is down, including features unrelated to the database\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Fixing the original fault often does not end the incident. A system can stay down after its trigger is gone, because retries, cold \u003ca href=\"#Cache\" data-term=\"Cache\">caches\u003c/a> and queued work keep it overloaded. This is sometimes called a metastable failure. Restarting everything at once tends to fail again, since instances come up with empty caches into full traffic.\u003c/p>\u003cp>Each defence interrupts a different step:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Defence\u003c/th>\u003cth>What it stops\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Timeout\" data-term=\"Timeout\">Timeout\u003c/a>\u003c/td>\u003ctd>Threads waiting indefinitely\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Circuit%20breaker\" data-term=\"Circuit breaker\">Circuit breaker\u003c/a>\u003c/td>\u003ctd>Calls to a failing dependency\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Bulkhead\" data-term=\"Bulkhead\">Bulkhead\u003c/a>\u003c/td>\u003ctd>One dependency using all capacity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Load%20shedding\" data-term=\"Load shedding\">Load shedding\u003c/a>\u003c/td>\u003ctd>Overload on survivors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retry budget\u003c/td>\u003ctd>A \u003ca href=\"#Retry%20storm\" data-term=\"Retry storm\">retry storm\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>To recover, reduce traffic at the edge, let the system drain, and bring load back in stages. Keep enough spare capacity that losing one instance or zone does not overload what remains.\u003c/p>","avoid":"","usage":["How did a slow reporting query take down login?","It was a cascading failure. The query held the connection pool, the API stalled, and retries finished it off."],"out":[29,45,48,49,51,47]},{"name":"Monolith","section":6,"description":"An application built and deployed as a single unit, with all its features running together and usually sharing one database.","body":"\u003cp>A monolith is an application built and deployed as a single unit. All its features run in the same process and usually share one database, and one part calls another with an ordinary function call. It can still run as many identical copies behind a \u003ca href=\"#Load%20balancer\" data-term=\"Load balancer\">load balancer\u003c/a>, so a monolith is not limited to one server.\u003c/p>\u003cp>For most new products a monolith is a reasonable starting point. Function calls do not fail the way network calls do, a database transaction can cover a whole operation, a stack trace shows the full path of a request, and there is one thing to build, test and deploy.\u003c/p>\u003cp>The costs appear as the codebase and the team grow:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Growing pain\u003c/th>\u003cth>How it shows up\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Slow pipeline\u003c/td>\u003ctd>A one-line fix waits for a long build and full test suite\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deploy contention\u003c/td>\u003ctd>Teams queue to release, and one bad change blocks everyone's\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shared fate\u003c/td>\u003ctd>A memory leak in reports takes down checkout too\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Uniform scaling\u003c/td>\u003ctd>Scaling one CPU-heavy feature means scaling the whole app\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tangled code\u003c/td>\u003ctd>A change in billing breaks something in shipping\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last row is often blamed on the deployment model, but it comes from weak internal boundaries. A tangled monolith split into services usually becomes a tangled distributed system. Fixing the structure first, by moving to a \u003ca href=\"#Modular%20monolith\" data-term=\"Modular monolith\">modular monolith\u003c/a>, addresses the cause and keeps deployment simple.\u003c/p>\u003cp>Some pains have targeted fixes. Slow or risky background work can run as a separate worker process from the same codebase. A \u003ca href=\"#Bulkhead\" data-term=\"Bulkhead\">bulkhead\u003c/a> can separate traffic types. Only when independent deployment or scaling is a demonstrated need does a move to \u003ca href=\"#Microservices\" data-term=\"Microservices\">microservices\u003c/a> justify its cost, and the \u003ca href=\"#Strangler%20fig\" data-term=\"Strangler fig\">strangler fig\u003c/a> approach allows that move in stages.\u003c/p>","avoid":"","usage":["Should a team of four start with separate services for users, billing and orders?","No. Build a monolith with clean module boundaries, and split something out when there's a concrete reason."],"out":[19,54,49,55,60]},{"name":"Modular monolith","section":6,"description":"A single deployable application divided into modules with enforced boundaries, each owning its own logic and data.","body":"\u003cp>A modular \u003ca href=\"#Monolith\" data-term=\"Monolith\">monolith\u003c/a> is a single deployable application divided into modules with enforced boundaries. Each module covers one business area, such as billing or inventory, owns its logic and data, and exposes a small public interface to the others. It deploys as one unit but is organised internally much like a set of services.\u003c/p>\u003cp>The pattern addresses a familiar symptom in large codebases. Someone renames a column in billing, and shipping breaks because it had been querying that table directly. The cause is that any code can reach any other code.\u003c/p>\u003cp>A modular monolith depends on a few rules:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>In practice\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Public interface\u003c/td>\u003ctd>Modules call only what another module explicitly exposes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Private internals\u003c/td>\u003ctd>Importing another module's internals fails the build\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data ownership\u003c/td>\u003ctd>Each module owns its tables, with no cross-module joins\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Explicit dependencies\u003c/td>\u003ctd>Allowed dependencies are declared, and cycles are rejected\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication\u003c/td>\u003ctd>Direct calls, or in-process events for loose coupling\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Enforcement is what separates this from a folder structure. Conventions erode under deadline pressure, so check boundaries automatically in CI. ArchUnit for Java and import-linter for Python are examples of tools for this.\u003c/p>\u003cp>The approach keeps most of the simplicity of a monolith: one deploy, in-process calls, and straightforward local development. A single transaction can still span modules when necessary, although relying on that makes a later split harder.\u003c/p>\u003cp>Its limits are those of any single deployable. Modules share a runtime, so a crash or memory leak in one affects all of them.\u003c/p>\u003cp>Clean boundaries keep future options open. If one module later needs independent scaling, its interface and data are already separated, so extracting it into one of a set of \u003ca href=\"#Microservices\" data-term=\"Microservices\">microservices\u003c/a> is a contained piece of work.\u003c/p>","avoid":"","usage":["We keep breaking each other's code, so should we move to services?","The problem is boundaries, not deployment. Try a modular monolith with import rules enforced in CI first."],"out":[53,55]},{"name":"Microservices","section":6,"description":"An architecture of small services that are deployed independently, each owning one business capability and its data.","body":"\u003cp>Microservices is an architecture in which an application is split into small services that are deployed independently, each owning one business capability and its data. Services communicate over the network, through APIs or messages. Size matters less than independence: a team should be able to change and release its service without coordinating with others.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>\u003ca href=\"#Monolith\" data-term=\"Monolith\">Monolith\u003c/a>\u003c/th>\u003cth>\u003ca href=\"#Modular%20monolith\" data-term=\"Modular monolith\">Modular monolith\u003c/a>\u003c/th>\u003cth>Microservices\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Deployment\u003c/td>\u003ctd>One unit\u003c/td>\u003ctd>One unit\u003c/td>\u003ctd>Per service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Internal calls\u003c/td>\u003ctd>Function call\u003c/td>\u003ctd>Function call via interface\u003c/td>\u003ctd>Network call\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transactions\u003c/td>\u003ctd>Single database\u003c/td>\u003ctd>Single database\u003c/td>\u003ctd>Across services is hard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scaling\u003c/td>\u003ctd>Whole app\u003c/td>\u003ctd>Whole app\u003c/td>\u003ctd>Per service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failure isolation\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>Possible, with effort\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Operational overhead\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>High\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The main reason to adopt them is organisational. When many teams share one codebase, coordination becomes the limit on delivery, and separate services let them ship on their own schedules. A small team usually gets the costs without this benefit.\u003c/p>\u003cp>Those costs are substantial. Every call can now fail or be slow, so you need \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeouts\u003c/a>, retries and \u003ca href=\"#Circuit%20breaker\" data-term=\"Circuit breaker\">circuit breakers\u003c/a>. A \u003ca href=\"#Cascading%20failure\" data-term=\"Cascading failure\">cascading failure\u003c/a> can cross service boundaries. Operations that were one transaction become a \u003ca href=\"#Saga\" data-term=\"Saga\">saga\u003c/a>. You also need \u003ca href=\"#Service%20discovery\" data-term=\"Service discovery\">service discovery\u003c/a>, distributed tracing (following one request across services) and automated deployment.\u003c/p>\u003cp>A common failure is the distributed monolith. Services are separate on paper, but they share a database or call each other in long synchronous chains, so a feature requires five coordinated deploys and one service being down breaks all of them. That combines the coupling of a monolith with the failure modes of a network.\u003c/p>\u003cp>Draw boundaries around business capabilities that change independently. If two services always change together, they should probably be one service.\u003c/p>","avoid":"","usage":["Why does adding one field to checkout need releases from five teams?","Because our microservices share a schema. We have a distributed monolith, and that's what we need to fix."],"out":[53,54,45,48,52,59,25]},{"name":"Event-driven architecture","section":6,"description":"A design where components announce what has happened through events, and other components react without being called directly.","body":"\u003cp>Event-driven architecture is a design in which components announce what has happened by emitting events, and other components react to those events without being called directly. An event is a record of a past fact, such as \u003ccode>OrderPlaced\u003c/code> or \u003ccode>PaymentFailed\u003c/code>. The sender does not know or care who consumes it.\u003c/p>\u003cp>Events differ from commands, and confusing them leads to tightly coupled designs:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Command\u003c/th>\u003cth>Event\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Meaning\u003c/td>\u003ctd>&quot;Do this&quot;\u003c/td>\u003ctd>&quot;This happened&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tense\u003c/td>\u003ctd>Imperative: \u003ccode>ChargeCard\u003c/code>\u003c/td>\u003ctd>Past: \u003ccode>CardCharged\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recipients\u003c/td>\u003ctd>One specific handler\u003c/td>\u003ctd>Zero, one or many\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sender knows\u003c/td>\u003ctd>Who will do the work\u003c/td>\u003ctd>Nothing about consumers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Can refuse?\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No, it already happened\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Events usually travel through \u003ca href=\"#Publish-subscribe\" data-term=\"Publish-subscribe\">publish-subscribe\u003c/a> or \u003ca href=\"#Event%20streaming\" data-term=\"Event streaming\">event streaming\u003c/a>. The benefit is loose coupling. To send a welcome gift when a user signs up, add a consumer of \u003ccode>UserSignedUp\u003c/code> and leave the signup service alone. If a consumer is down, the rest of the system keeps running and it can catch up later.\u003c/p>\u003cp>The costs show up in understanding and debugging. There is no single place to read the flow of a business process, so &quot;what happens after an order is placed?&quot; requires tracing several consumers. When a step silently does not happen, there may be no error anywhere. Attach a correlation ID (one identifier carried through every related event) and use tracing to reconstruct what occurred.\u003c/p>\u003cp>Results are also eventually consistent, meaning different parts of the system catch up at different times. A customer places an order and their order history does not show it for a few seconds. The interface has to allow for that.\u003c/p>\u003cp>Consumers must handle duplicate and out-of-order events. Publish reliably with the \u003ca href=\"#Outbox%20pattern\" data-term=\"Outbox pattern\">outbox pattern\u003c/a>, and treat event schemas as contracts, because you may not know everyone who depends on them.\u003c/p>","avoid":"","usage":["Do we have to touch checkout to add loyalty points?","No, that flow uses event-driven architecture. Loyalty can consume \u003ccode>OrderPaid\u003c/code> without checkout knowing it exists."],"out":[39,40,44]},{"name":"CQRS","section":6,"description":"Command Query Responsibility Segregation, a pattern that uses separate models for changing data and for reading it.","body":"\u003cp>CQRS, or Command Query Responsibility Segregation, is a pattern that uses separate models for changing data and for reading it. Commands such as \u003ccode>PlaceOrder\u003c/code> go through a write model that enforces business rules. Queries such as &quot;show this customer's order history&quot; go through a read model shaped for that screen.\u003c/p>\u003cp>The motivation is that the two sides often want different structures. A write model benefits from normalised tables and strict validation. A dashboard wants wide, denormalised rows it can fetch in one query. Forcing both through one model produces a domain object with dozens of fields and a reporting query that joins nine tables and slows checkout on the same database.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>Command side\u003c/th>\u003cth>Query side\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Purpose\u003c/td>\u003ctd>Change state\u003c/td>\u003ctd>Return data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Model\u003c/td>\u003ctd>Business rules, invariants\u003c/td>\u003ctd>Shaped per screen or report\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>Often normalised\u003c/td>\u003ctd>Often denormalised or a search index\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scaling\u003c/td>\u003ctd>Limited by write correctness\u003c/td>\u003ctd>Copies \u003ca href=\"#Horizontal%20scaling\" data-term=\"Horizontal scaling\">scale out\u003c/a> for a \u003ca href=\"#Read-heavy%20workload\" data-term=\"Read-heavy workload\">read-heavy workload\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Returns\u003c/td>\u003ctd>Success or failure\u003c/td>\u003ctd>Data, no side effects\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>CQRS has levels. The simplest keeps one database and uses separate code paths for reads and writes, which adds little cost. A fuller version has separate read stores, updated from the write side through events, often using the \u003ca href=\"#Outbox%20pattern\" data-term=\"Outbox pattern\">outbox pattern\u003c/a>.\u003c/p>\u003cp>Separate stores introduce replication lag, and this is the failure users notice. Someone saves a change, the page reloads from the read model, and the old value appears, so they save again. Common responses are to show the submitted value optimistically in the interface, or to have the client wait until the read model reaches a given version.\u003c/p>\u003cp>CQRS is often paired with \u003ca href=\"#Event%20sourcing\" data-term=\"Event sourcing\">event sourcing\u003c/a>, but neither requires the other. It adds moving parts, so for simple create-read-update-delete screens, a single model is usually the right choice.\u003c/p>","avoid":"","usage":["The analytics page keeps locking the orders table during checkout.","Use CQRS for that area. Project orders into a reporting table and let the page read from there."],"out":[11,8,44,58]},{"name":"Event sourcing","section":6,"description":"Storing every change to an entity as an append-only sequence of events and deriving current state by replaying them.","body":"\u003cp>Event sourcing stores every change to an entity as an append-only sequence of events, and derives the current state by replaying them. A conventional table keeps only the latest value and overwrites the previous one. An event-sourced system keeps the full history, in the way a bank ledger records transactions and calculates a balance from them.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Sequence\u003c/th>\u003cth>Event\u003c/th>\u003cth>Balance after replay\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ccode>AccountOpened\u003c/code>\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ccode>Deposited 100\u003c/code>\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ccode>Withdrawn 30\u003c/code>\u003c/td>\u003ctd>70\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ccode>Deposited 50\u003c/code>\u003c/td>\u003ctd>120\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The event log is the source of truth. This gives a complete audit trail, lets you reconstruct the state at any past moment, and answers questions such as &quot;how did this order end up cancelled?&quot;, which an overwritten row cannot. It also lets you build new read models from existing history, which is why it is often combined with \u003ca href=\"#CQRS\" data-term=\"CQRS\">CQRS\u003c/a>.\u003c/p>\u003cp>It is different from \u003ca href=\"#Event%20streaming\" data-term=\"Event streaming\">event streaming\u003c/a>. A stream moves events between systems. Event sourcing uses events as the primary storage for an entity's state, and needs to load all events for one entity reliably and reject conflicting writes, usually by checking an expected version number on append.\u003c/p>\u003cp>The costs tend to appear later:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>Why it happens\u003c/th>\u003cth>Usual response\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Slow loads\u003c/td>\u003ctd>Long histories take time to replay\u003c/td>\u003ctd>Periodic snapshots of state\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Schema change\u003c/td>\u003ctd>Old events are immutable\u003c/td>\u003ctd>Versioned events, upgrade them when read\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Personal data\u003c/td>\u003ctd>Logs are not meant to be edited\u003c/td>\u003ctd>Encrypt per user, delete the key to erase\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Querying\u003c/td>\u003ctd>Log is poor for &quot;find all X&quot;\u003c/td>\u003ctd>Separate read models\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Replay effects\u003c/td>\u003ctd>Replaying could resend emails\u003c/td>\u003ctd>Keep side effects out of state rebuilding\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Use event sourcing where history is itself a business requirement, as in accounting or compliance. For ordinary data, a table plus an audit log is much simpler.\u003c/p>","avoid":"","usage":["Support can't tell how this invoice reached a negative total.","If billing used event sourcing, we could replay it step by step. Today we only have the final row."],"out":[57,40]},{"name":"Saga","section":6,"description":"A multi-service operation run as a series of local transactions, with compensating steps to undo earlier work on failure.","body":"\u003cp>A saga is a multi-service operation run as a series of local transactions, with a compensating action to undo each completed step if a later one fails. It is used when one business action spans several databases, as is common in \u003ca href=\"#Microservices\" data-term=\"Microservices\">microservices\u003c/a>, and a single atomic transaction is unavailable or impractical.\u003c/p>\u003cp>Placing an order might look like this:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Service\u003c/th>\u003cth>Action\u003c/th>\u003cth>Compensation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Orders\u003c/td>\u003ctd>Create as pending\u003c/td>\u003ctd>Cancel order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Inventory\u003c/td>\u003ctd>Reserve stock\u003c/td>\u003ctd>Release stock\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Payments\u003c/td>\u003ctd>Charge card\u003c/td>\u003ctd>Refund\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Shipping\u003c/td>\u003ctd>Book courier\u003c/td>\u003ctd>Cancel booking\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If payment fails at step 3, the saga runs the compensations for steps 2 and 1 in reverse: release the stock, then cancel the order. If the courier booking fails at step 4, it refunds the card first. Without this logic, the familiar result is a customer who was charged for an order that stays stuck.\u003c/p>\u003cp>There are two ways to coordinate the steps:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Style\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Orchestration\u003c/td>\u003ctd>A coordinator tells each service what to do\u003c/td>\u003ctd>Flow is visible, coordinator is extra code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Choreography\u003c/td>\u003ctd>Each service reacts to the previous event\u003c/td>\u003ctd>No coordinator, flow is hard to follow\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Compensation is not a true rollback. A refund is a new transaction, and the customer may see both the charge and the refund on a statement. Place steps that are hard to undo as late as possible.\u003c/p>\u003cp>Sagas also lack isolation, so other requests can see intermediate state, such as stock that is reserved and then released. Mark such records as pending.\u003c/p>\u003cp>Messages can be redelivered, so every step and every compensation must be idempotent, meaning safe to repeat. Use the \u003ca href=\"#Outbox%20pattern\" data-term=\"Outbox pattern\">outbox pattern\u003c/a> to publish each step reliably, and persist the saga's state so it can resume after a crash.\u003c/p>","avoid":"","usage":["Payment succeeded, but the courier booking failed and the order is stuck in pending.","The saga isn't compensating for that failure. It should refund, release the stock and cancel automatically."],"out":[55,44]},{"name":"Strangler fig","section":6,"description":"Replacing a legacy system gradually by routing one feature at a time to a new system until the old one can be removed.","body":"\u003cp>The strangler fig is a migration pattern that replaces a legacy system gradually, by routing one feature at a time to a new system until the old one can be removed. The name comes from a plant that grows around a host tree and can eventually replace it.\u003c/p>\u003cp>The alternative is a full rewrite, and its failure is a familiar one. A team spends a long time rebuilding the product while the old system keeps gaining features, so the target keeps moving, nothing reaches users until the end, and the cutover is a single high-risk event. This pattern ships in small, reversible steps.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Put a routing layer, such as a \u003ca href=\"#Reverse%20proxy\" data-term=\"Reverse proxy\">reverse proxy\u003c/a> or \u003ca href=\"#API%20gateway\" data-term=\"API gateway\">API gateway\u003c/a>, in front of the old system\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Pick one well-bounded feature and build it in the new system\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Send a small share of its traffic to the new version\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Compare results and error rates, and increase the share\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Delete the old code for that feature\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Repeat, then remove the routing layer when nothing old remains\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Rollback at step 3 or 4 is a routing change. Shadowing helps before that: the new version receives a copy of live requests, and its responses are compared but not returned.\u003c/p>\u003cp>Data is usually the hardest part. Options include having the new service call the old database temporarily, syncing changes between stores, or writing to both during a transition. Decide which system is the source of truth for each entity at each stage.\u003c/p>\u003cp>The common failure is stopping halfway. Once the easy features have moved, the hard ones remain, priorities shift, and the team now runs two systems indefinitely. Track the traffic still served by the old system.\u003c/p>","avoid":"","usage":["Can we rewrite the billing \u003ca href=\"#Monolith\" data-term=\"Monolith\">monolith\u003c/a> in one go over the next year?","Too risky. Use a strangler fig: put a proxy in front and move invoices first."],"out":[22,23,53]},{"name":"Backend for frontend","section":6,"description":"A dedicated backend layer for one type of client, shaping data and calls to suit that client's needs.","body":"\u003cp>A backend for frontend, or BFF, is a dedicated server-side layer built for one type of client, such as the web app or the mobile app. It calls the underlying services and returns data shaped for that client's screens.\u003c/p>\u003cp>The pattern addresses a recognisable problem with a shared API. Mobile users download large responses and discard most of the fields. A single phone screen needs six round trips, which is slow on a poor connection. Meanwhile, the API accumulates parameters and \u003ccode>if (client == &quot;ios&quot;)\u003c/code> branches, and a change requested by one client team risks breaking another.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Client\u003c/th>\u003cth>What its BFF does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mobile\u003c/td>\u003ctd>Combines calls into one, trims fields, resizes image URLs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Web\u003c/td>\u003ctd>Returns richer data, manages sessions with secure cookies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TV\u003c/td>\u003ctd>Returns simple layouts suited to remote-control navigation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Partner\u003c/td>\u003ctd>Exposes a stable, versioned contract\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A BFF is usually owned by the same team as the client it serves, so that team can change its API without waiting for another group. For browser apps, it can also keep access tokens on the server and give the browser only a session cookie, which limits what a malicious script could steal.\u003c/p>\u003cp>It differs from an \u003ca href=\"#API%20gateway\" data-term=\"API gateway\">API gateway\u003c/a>. A gateway is one shared entry point handling generic concerns such as authentication and \u003ca href=\"#Rate%20limiting\" data-term=\"Rate limiting\">rate limiting\u003c/a>. A BFF contains logic specific to one client, and often sits behind a gateway.\u003c/p>\u003cp>The main risk is duplication. Business rules that creep into each BFF will drift apart, so the web app and the mobile app calculate a discount differently. Keep BFFs to aggregation and formatting, and leave rules in the underlying services. GraphQL, a query language that lets clients request specific fields, is a common alternative when the main need is flexible data fetching.\u003c/p>","avoid":"","usage":["The app makes eleven calls to render the home screen.","Add a backend for frontend for mobile, so it makes one call and gets exactly what the screen needs."],"out":[23,26]},{"name":"Sidecar","section":6,"description":"A helper process deployed alongside an application instance to provide supporting functions without changing its code.","body":"\u003cp>A sidecar is a helper process deployed alongside each application instance to provide supporting functions without changes to the application's code. The two run together, start and stop together, and usually talk over localhost. In Kubernetes, a sidecar is typically a second container in the same pod, sharing its network and optionally its storage.\u003c/p>\u003cp>The pattern is useful when many services, possibly in different languages, need the same capability. Without it, every team installs and upgrades its own library, and versions drift.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Sidecar job\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Traffic proxy\u003c/td>\u003ctd>Handles TLS, retries, \u003ca href=\"#Timeout\" data-term=\"Timeout\">timeouts\u003c/a>, routing\u003c/td>\u003ctd>Envoy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Log shipping\u003c/td>\u003ctd>Reads local logs and forwards them\u003c/td>\u003ctd>Fluent Bit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metrics\u003c/td>\u003ctd>Collects and exports telemetry\u003c/td>\u003ctd>OpenTelemetry Collector\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secrets\u003c/td>\u003ctd>Fetches and refreshes credentials\u003c/td>\u003ctd>Vault Agent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Database proxy\u003c/td>\u003ctd>Manages secure connections\u003c/td>\u003ctd>Cloud SQL Auth Proxy\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A service mesh, a dedicated layer for service-to-service traffic, commonly places a proxy sidecar beside every instance. Istio and Linkerd are examples.\u003c/p>\u003cp>Lifecycle ordering causes the most familiar bugs. An application starts before its proxy is ready, and its first network calls fail with connection refused. During shutdown, the proxy exits first, and in-flight requests are dropped. In a batch job, the main container finishes while the sidecar keeps running, so the job never completes. Kubernetes now has native sidecar containers that start before the main containers and stop after them, which addresses much of this.\u003c/p>\u003cp>The costs multiply with scale. A sidecar using 100 MB of memory across 1,000 pods consumes about 100 GB. A proxy also adds a local network hop to every request, adding some \u003ca href=\"#Latency\" data-term=\"Latency\">latency\u003c/a>.\u003c/p>\u003cp>For a single service, a library is usually simpler.\u003c/p>","avoid":"","usage":["Half the pods throw connection errors for the first few seconds after boot.","The app starts before the Envoy sidecar is ready. Make it a native sidecar with a startup probe, so the app waits until the proxy is ready."],"out":[45,3]}]}
    </script>
    <script>
      (() => {
        const data = JSON.parse(
          document.getElementById("graph-data").textContent
        );
        const $ = (id) => document.getElementById(id);
        const stage = $("stage");
        const panel = $("panel");
        const panelBody = $("panel-body");
        const resizer = $("resizer");
        const search = $("search");
        const input = $("search-input");
        const results = $("results");
        const info = $("info");
        const infoBtn = $("info-btn");
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

        const INK = "#1c1c1a";
        const BG = "#ededE9";
        // Hubs keep their label even when it crosses another circle.
        const HUB_WEIGHT = 0.7;
        const esc = (s) =>
          s.replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
          );
        const hashFor = (name) => "#" + encodeURIComponent(name);

        const nodes = data.terms.map((term, i) => ({
          ...term,
          id: i,
          incoming: [],
        }));
        const links = [];
        const linkKeys = new Set();
        nodes.forEach((n) =>
          n.out.forEach((t) => {
            nodes[t].incoming.push(n.id);
            links.push({ source: n.id, target: t, from: n.id, to: t });
            linkKeys.add(n.id + ">" + t);
          })
        );
        // A two-way pair is drawn as one line; both directions keep their particles.
        links.forEach((l) => {
          l.hiddenTwin = l.from > l.to && linkKeys.has(l.to + ">" + l.from);
        });

        const maxIncoming = Math.max(...nodes.map((n) => n.incoming.length), 1);
        const sectionCount = data.sections.length;
        const stageBox = stage.getBoundingClientRect();
        const landscape = stageBox.width >= stageBox.height;
        const anchorRadiusX = landscape ? 360 : 170;
        const anchorRadiusY = landscape ? 190 : 320;
        nodes.forEach((n, i) => {
          const weight = Math.sqrt(n.incoming.length / maxIncoming);
          const shade = Math.round(214 - weight * 158);
          n.weight = weight;
          n.r = 4 + Math.sqrt(n.incoming.length) * 2.9;
          n.fill = `rgb(${shade},${shade},${shade - 3})`;
          n.neighbors = new Set([n.id, ...n.out, ...n.incoming]);
          const angle = (n.section / sectionCount) * Math.PI * 2;
          n.anchorX = sectionCount > 1 ? Math.cos(angle) * anchorRadiusX : 0;
          n.anchorY = sectionCount > 1 ? Math.sin(angle) * anchorRadiusY : 0;
          n.x = n.anchorX + Math.cos(i * 2.4) * (30 + i);
          n.y = n.anchorY + Math.sin(i * 2.4) * (30 + i);
        });
        const byName = new Map(nodes.map((n) => [n.name, n]));

        let selected = null;
        let hovered = null;
        let userMoved = false;
        let pauseTimer = 0;
        let particleFocus = null;
        // The selected term keeps the highlight; hovering only adds to it.
        const focusNode = () => selected || hovered;
        const isVisible = (n, f) =>
          !f || f.neighbors.has(n.id) || n === hovered;
        const endpoint = (v) => (typeof v === "object" ? v.id : v);
        const isFocusLink = (l) => {
          const f = focusNode();
          return (
            !!f && (endpoint(l.source) === f.id || endpoint(l.target) === f.id)
          );
        };

        function collideForce() {
          let all = [];
          const force = () => {
            for (let i = 0; i < all.length; i++) {
              for (let j = i + 1; j < all.length; j++) {
                const a = all[i],
                  b = all[j];
                const dx = b.x - a.x || 0.01,
                  dy = b.y - a.y || 0.01;
                const d = Math.hypot(dx, dy);
                const min = a.r + b.r + 9;
                if (d >= min) continue;
                const push = ((min - d) / d) * 0.5;
                b.x += dx * push;
                b.y += dy * push;
                a.x -= dx * push;
                a.y -= dy * push;
              }
            }
          };
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function sectionForce() {
          let all = [];
          const force = (alpha) =>
            all.forEach((n) => {
              n.vx += (n.anchorX - n.x) * 0.035 * alpha;
              n.vy += (n.anchorY - n.y) * 0.035 * alpha;
            });
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function drawNode(n, ctx, k) {
          const near = isVisible(n, focusNode());
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          if (!near) {
            // An opaque base stops lines showing through dimmed circles.
            ctx.fillStyle = BG;
            ctx.fill();
          }
          ctx.globalAlpha = near ? 1 : 0.15;
          ctx.fillStyle = n.fill;
          ctx.fill();
          ctx.globalAlpha = 1;
          if (n === selected) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 3.2 / Math.max(k, 0.6), 0, Math.PI * 2);
            ctx.strokeStyle = INK;
            ctx.lineWidth = 1.4 / k;
            ctx.stroke();
          }
        }

        function drawLabels(ctx, k) {
          const f = focusNode();
          const rank = (n) =>
            (n === hovered
              ? 4
              : n === f
                ? 3
                : f && f.neighbors.has(n.id)
                  ? 2
                  : 0) + n.weight;
          const placed = [];
          const order = nodes
            .filter((n) => isVisible(n, f))
            .sort((a, b) => rank(b) - rank(a));
          const hitsCircle = (box, self) =>
            order.some((m) => {
              if (m === self) return false;
              const cx = Math.max(box.l, Math.min(m.x, box.r));
              const cy = Math.max(box.t, Math.min(m.y, box.b));
              return Math.hypot(m.x - cx, m.y - cy) < m.r;
            });
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.lineJoin = "round";
          for (const n of order) {
            const pinned = n === f || n === hovered;
            const px = n === f ? 15 : n === hovered ? 13 : 8.5 + n.weight * 5.5;
            const size = px / k;
            ctx.font = `${size}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
            if ("letterSpacing" in ctx) ctx.letterSpacing = `${size * 0.06}px`;
            const text = n.name.toUpperCase();
            const w = ctx.measureText(text).width;
            const y = n.y - n.r - 5 / k;
            const box = {
              l: n.x - w / 2 - 3 / k,
              r: n.x + w / 2 + 3 / k,
              t: y - size - 1 / k,
              b: y + 1 / k,
            };
            if (
              !pinned &&
              ((n.weight < HUB_WEIGHT && hitsCircle(box, n)) ||
                placed.some(
                  (p) =>
                    box.l < p.r && box.r > p.l && box.t < p.b && box.b > p.t
                ))
            )
              continue;
            placed.push(box);
            ctx.globalAlpha = 0.9;
            ctx.strokeStyle = BG;
            ctx.lineWidth = 3.5 / k;
            ctx.strokeText(text, n.x, y);
            ctx.globalAlpha = pinned ? 1 : f ? 0.82 : 0.38 + n.weight * 0.55;
            ctx.fillStyle = INK;
            ctx.fillText(text, n.x, y);
          }
          ctx.globalAlpha = 1;
          if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
        }

        const graph = new ForceGraph($("graph"))
          .backgroundColor("rgba(0,0,0,0)")
          .nodeId("id")
          .nodeLabel(() => "")
          .nodeCanvasObject(drawNode)
          .nodePointerAreaPaint((n, color, ctx) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 2, 0, Math.PI * 2);
            ctx.fill();
          })
          .linkColor((l) => {
            if (l.hiddenTwin) return "rgba(0,0,0,0)";
            if (!focusNode()) return "rgba(28,28,26,.09)";
            return isFocusLink(l) ? "rgba(28,28,26,.5)" : "rgba(28,28,26,.025)";
          })
          .linkWidth((l) => (isFocusLink(l) ? 0.9 : 0.5))
          .linkDirectionalParticles((l) =>
            !reducedMotion.matches && isFocusLink(l) ? 2 : 0
          )
          .linkDirectionalParticleWidth(2.2)
          .linkDirectionalParticleSpeed(0.005)
          .linkDirectionalParticleColor(() => INK)
          .minZoom(0.25)
          .maxZoom(6)
          .warmupTicks(280)
          .cooldownTicks(70)
          .onRenderFramePost(drawLabels)
          .onNodeClick((n) => go(n.name))
          .onBackgroundClick(() => go(null))
          .onNodeHover((n) => {
            hovered = n || null;
            wake();
          })
          .onNodeDragEnd((n) => {
            n.fx = undefined;
            n.fy = undefined;
          })
          .onZoom((t) => {
            if (t && programmaticUntil < performance.now()) userMoved = true;
          });

        graph.d3Force("charge").strength(-340).distanceMax(760);
        graph
          .d3Force("link")
          .distance((l) => 46 + l.source.r + l.target.r)
          .strength(
            (l) =>
              0.55 / Math.min(l.source.neighbors.size, l.target.neighbors.size)
          );
        graph.d3Force("collide", collideForce());
        graph.d3Force("section", sectionForce());
        graph.graphData({ nodes, links });

        let programmaticUntil = 0;
        const camera = (ms) => {
          programmaticUntil = performance.now() + ms + 80;
        };

        function fitAll(ms = 0) {
          camera(ms);
          graph.zoomToFit(ms, 54);
        }

        function focusCamera(ms = 650) {
          if (!selected) return;
          const box = stage.getBoundingClientRect();
          let reach = selected.r;
          selected.neighbors.forEach((id) => {
            const m = nodes[id];
            reach = Math.max(
              reach,
              Math.hypot(m.x - selected.x, m.y - selected.y) + m.r
            );
          });
          const k = Math.min(
            2.2,
            Math.max(0.5, (Math.min(box.width, box.height) / 2 - 40) / reach)
          );
          camera(ms);
          graph.centerAt(selected.x, selected.y, ms);
          graph.zoom(k, ms);
        }

        function wake() {
          const f = focusNode();
          if (f !== particleFocus) {
            particleFocus = f;
            // force-graph only rebuilds particles when this prop is set.
            graph.linkDirectionalParticles((l) =>
              !reducedMotion.matches && isFocusLink(l) ? 2 : 0
            );
          }
          graph.autoPauseRedraw(false);
          clearTimeout(pauseTimer);
          if (!focusNode() || reducedMotion.matches) {
            pauseTimer = setTimeout(() => graph.autoPauseRedraw(true), 160);
          }
        }

        function renderPanel(n) {
          const chip = (id) =>
            `<a class="chip" href="${hashFor(nodes[id].name)}" data-term="${esc(nodes[id].name)}">${esc(nodes[id].name)}</a>`;
          const linkedFrom = n.incoming.filter((id) => !n.out.includes(id));
          panelBody.innerHTML = `
            <div class="eyebrow">${esc(data.sections[n.section])}</div>
            <h1 tabindex="-1">${esc(n.name)}</h1>
            ${n.description ? `<p class="lede">${esc(n.description)}</p>` : ""}
            ${n.usage.length ? `<section class="block"><span class="label">${esc(data.labels.quotes)}</span>
              <div class="bubbles">${n.usage.map((u) => `<div class="bubble">${u}</div>`).join("")}</div>
            </section>` : ""}
            ${n.avoid ? `<section class="block"><span class="label">${esc(data.labels.note)}</span><p class="avoid">${n.avoid}</p></section>` : ""}
            ${n.out.length ? `<section class="block"><span class="label">${esc(data.labels.outgoing)}</span><div class="chips">${n.out.map(chip).join("")}</div></section>` : ""}
            ${linkedFrom.length ? `<section class="block"><span class="label">${esc(data.labels.incoming)}</span><div class="chips">${linkedFrom.map(chip).join("")}</div></section>` : ""}
            ${n.body ? `<section class="block"><details><summary><span class="label">${esc(data.labels.body)}</span></summary><div class="entry">${n.body}</div></details></section>` : ""}`;
          panel.scrollTop = 0;
        }

        function applyHash({ moveFocus = false } = {}) {
          let name = "";
          try {
            name = decodeURIComponent(location.hash.slice(1));
          } catch {
            name = "";
          }
          selected = byName.get(name) || null;
          hovered = null;
          $("hint").hidden = !!selected;
          document.body.classList.toggle("has-selection", !!selected);
          document.title = selected
            ? `${selected.name} — ${data.title}`
            : `${data.title} — Graph`;
          if (selected) {
            renderPanel(selected);
            panel.hidden = false;
            if (moveFocus)
              panelBody.querySelector("h1").focus({ preventScroll: true });
          } else {
            panel.hidden = true;
          }
          resizer.hidden = !selected;
          syncResizer();
          resize();
          if (selected) focusCamera();
          else if (graphReady) {
            userMoved = false;
            fitAll(600);
          }
          wake();
        }

        function go(name) {
          closePopovers();
          const next = name ? hashFor(name) : "";
          if (location.hash === next) {
            if (name) focusCamera();
            return;
          }
          location.hash = next;
        }

        function resize() {
          const box = stage.getBoundingClientRect();
          graph.width(Math.round(box.width)).height(Math.round(box.height));
        }

        const PANEL_MIN = 300;
        const STAGE_MIN = 320;
        const PANEL_WIDTH_KEY = `graph-explorer:${data.title}:panel-width`;
        let preferredWidth = readPanelWidth();
        let resizing = false;
        let grabOffset = 0;

        function readPanelWidth() {
          try {
            const value = Number(localStorage.getItem(PANEL_WIDTH_KEY));
            return Number.isFinite(value) && value > 0 ? value : null;
          } catch {
            return null;
          }
        }

        function savePanelWidth() {
          try {
            if (preferredWidth === null)
              localStorage.removeItem(PANEL_WIDTH_KEY);
            else localStorage.setItem(PANEL_WIDTH_KEY, String(preferredWidth));
          } catch {
            // Storage can be unavailable; the width still applies this visit.
          }
        }

        const maxPanelWidth = () => Math.max(PANEL_MIN, innerWidth - STAGE_MIN);
        const clampPanelWidth = (width) =>
          Math.round(Math.min(maxPanelWidth(), Math.max(PANEL_MIN, width)));

        function syncResizer() {
          resizer.setAttribute("aria-valuemin", String(PANEL_MIN));
          resizer.setAttribute("aria-valuemax", String(maxPanelWidth()));
          if (!panel.hidden) {
            resizer.setAttribute(
              "aria-valuenow",
              String(Math.round(panel.getBoundingClientRect().width))
            );
          }
        }

        // The saved width is kept as-is so it returns when the window grows.
        function applyPanelWidth() {
          const root = document.documentElement;
          if (preferredWidth === null)
            root.style.removeProperty("--panel-width");
          else
            root.style.setProperty(
              "--panel-width",
              `${clampPanelWidth(preferredWidth)}px`
            );
          syncResizer();
        }

        function setPanelWidth(width) {
          preferredWidth = clampPanelWidth(width);
          applyPanelWidth();
        }

        function endResize() {
          if (!resizing) return;
          resizing = false;
          document.body.classList.remove("resizing");
          savePanelWidth();
          focusCamera(200);
        }

        resizer.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          resizer.setPointerCapture(e.pointerId);
          grabOffset = e.clientX - panel.getBoundingClientRect().left;
          resizing = true;
          document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", (e) => {
          if (!resizing) return;
          const right = $("app").getBoundingClientRect().right;
          setPanelWidth(right - (e.clientX - grabOffset));
        });
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);
        resizer.addEventListener("lostpointercapture", endResize);
        resizer.addEventListener("dblclick", () => {
          preferredWidth = null;
          applyPanelWidth();
          savePanelWidth();
        });
        resizer.addEventListener("keydown", (e) => {
          const step = e.shiftKey ? 64 : 24;
          const current = panel.getBoundingClientRect().width;
          const next = {
            ArrowLeft: current + step,
            ArrowRight: current - step,
            Home: PANEL_MIN,
            End: maxPanelWidth(),
          }[e.key];
          if (next === undefined) return;
          e.preventDefault();
          setPanelWidth(next);
          savePanelWidth();
        });
        window.addEventListener("resize", applyPanelWidth);
        applyPanelWidth();

        new ResizeObserver(() => {
          resize();
          if (selected) focusCamera(resizing ? 0 : 250);
          else if (graphReady && !userMoved) fitAll(0);
          wake();
        }).observe(stage);

        function closePopovers() {
          search.hidden = true;
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
        }

        let matches = [];
        let active = 0;

        function renderResults() {
          const q = input.value.trim().toLowerCase();
          const score = (n) => {
            const name = n.name.toLowerCase();
            if (!q) return 3;
            if (name === q) return 0;
            if (name.startsWith(q)) return 1;
            if (name.includes(q)) return 2;
            return n.description.toLowerCase().includes(q) ? 3 : 9;
          };
          matches = nodes
            .filter((n) => score(n) < 9)
            .sort(
              (a, b) => score(a) - score(b) || a.name.localeCompare(b.name)
            );
          active = Math.min(active, Math.max(matches.length - 1, 0));
          results.innerHTML = matches.length
            ? matches
                .map(
                  (n, i) =>
                    `<li id="result-${i}" role="option" aria-selected="${i === active}" data-name="${esc(n.name)}">${esc(n.name)}<small>${esc(n.description)}</small></li>`
                )
                .join("")
            : `<li class="none">No matching ${esc(data.nouns)}</li>`;
          if (matches.length) {
            input.setAttribute("aria-activedescendant", `result-${active}`);
            $(`result-${active}`).scrollIntoView({ block: "nearest" });
          } else input.removeAttribute("aria-activedescendant");
        }

        function openSearch() {
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
          search.hidden = false;
          input.value = "";
          active = 0;
          renderResults();
          input.focus();
        }

        function pick(name) {
          go(name);
          requestAnimationFrame(() => {
            const heading = panelBody.querySelector("h1");
            if (heading) heading.focus({ preventScroll: true });
          });
        }

        input.addEventListener("input", () => {
          active = 0;
          renderResults();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!matches.length) return;
            active =
              (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) %
              matches.length;
            renderResults();
          } else if (e.key === "Enter" && matches[active]) {
            e.preventDefault();
            pick(matches[active].name);
          }
        });
        results.addEventListener("mousedown", (e) => e.preventDefault());
        results.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-name]");
          if (li) pick(li.dataset.name);
        });

        $("search-btn").addEventListener("click", () =>
          search.hidden ? openSearch() : closePopovers()
        );
        infoBtn.addEventListener("click", () => {
          const open = info.hidden;
          closePopovers();
          info.hidden = !open;
          infoBtn.setAttribute("aria-expanded", String(open));
        });
        $("close").addEventListener("click", () => go(null));
        $("info-counts").textContent =
          `${nodes.length} ${nodes.length === 1 ? data.noun : data.nouns}, ${links.length} ${links.length === 1 ? "link" : "links"}, ${data.sections.length} ${data.sections.length === 1 ? "group" : "groups"}.`;

        panel.addEventListener("mouseover", (e) => {
          const a = e.target.closest("[data-term]");
          const next = a ? byName.get(a.dataset.term) || null : null;
          if (next !== hovered) {
            hovered = next;
            wake();
          }
        });
        panel.addEventListener("mouseleave", () => {
          hovered = null;
          wake();
        });

        document.addEventListener("keydown", (e) => {
          const typing = /^(INPUT|TEXTAREA)$/.test(
            document.activeElement?.tagName || ""
          );
          if (
            (e.key === "/" && !typing) ||
            (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))
          ) {
            e.preventDefault();
            openSearch();
          } else if (e.key === "Escape") {
            if (!search.hidden || !info.hidden) {
              const fromSearch = !search.hidden;
              closePopovers();
              if (fromSearch) $("search-btn").focus();
            } else if (selected) go(null);
          }
        });

        window.addEventListener("hashchange", () =>
          applyHash({ moveFocus: true })
        );

        let graphReady = false;
        resize();
        setTimeout(() => {
          graphReady = true;
          if (location.hash.length > 1) applyHash();
          else fitAll(0);
        }, 60);
      })();
    </script>
  </body>
</html>
